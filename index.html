'use strict';
const COURSE={"units": [{"title": "面对长算式，先分块、再选路", "short": "开算前的三眼", "tag": "起点 · 减少复杂感", "intro": "简便计算不是跳过规则，而是先看清结构，再做等价变形。这一关先把符号、顺序和五条运算律接起来。准备一张草稿纸：读规则，试一次“选第一步”，再看例题和检测。", "paragraphs": [["第一眼，先把长算式分成几块", "你已经会基本运算，不必从头背规则。真正容易卡住的是：同时盯着太多符号。先找最外层加减，把每个完整乘积、商或幂看成一块，保留块前的符号。每块单独算，再合并。"], ["第二眼，找能少算的关系", "不要一看到分数就通分，一看到括号就展开。先找相反数、能凑成 0 或 1 的括号、能约分的因数、相同的乘数。只有确实更省事时再变形。"], ["第三眼，把容易看错的符号圈起来", "重点圈三种位置：负号是否在乘方的底数里、减号后括号的整体、除号后完整的除数。例如 −2² 与 (−2)² 不同，a−(b−c) 中 c 去括号后为正，a÷(b+c) 中的和不能拆成两个除数。"], ["计算后，换一个角度检查", "不要只沿原步骤再算一遍。检查符号是否合理、大小是否在预计范围内、各项是否都保留。这里的估算只用于发现错误；正式答案仍要精确计算。"]], "laws": true, "lab": {"title": "选第一步：看顺序，也看括号", "instruction": "依次切换三个算式。先在草稿纸圈出应最先处理的部分，再点击一个选项。比较“有括号”和“同级运算”两种情况。", "cases": [["−3² + 12 ÷ (−4)", ["先算 −3²", "先把 −3 和 12 相加", "先把 12 与 −4 相加"], 0, "乘方优先，−3² = −9。接着算 12 ÷ (−4) = −3，最后 −9 + (−3) = −12。"], ["18 ÷ (−3) × 2", ["先算 (−3) × 2", "先算 18 ÷ (−3)", "把 ÷ 换成 +"], 1, "乘除同级，从左到右：18 ÷ (−3) × 2 = −6 × 2 = −12。先算后两个数的积，会擅自改变算式结构。"], ["(−2 + 5)² − 8", ["先算 5²", "先算 8²", "先算 −2 + 5"], 2, "括号先算：−2 + 5 = 3，再算 3² = 9，最后 9 − 8 = 1。"]]}, "examples": [{"title": "括号让负号的身份不同", "expr": "−2² + (−2)³ − (−3)²", "notice": "逐个圈出底数。第一个负号在乘方外，后两个负号属于底数。", "steps": [["先乘方", "= −4 + (−8) − 9", "−2² 是 2² 的相反数；(−2)³ 为负；(−3)² 为正。"], ["再转化减法", "= −4 + (−8) + (−9)", "减去 9 等于加上 −9。"], ["同号相加", "= −21", "三个负数相加，把绝对值相加并保留负号。"]], "trap": "不能把 −2² 算成 4。"}, {"title": "乘除同级，从左到右", "expr": "24 ÷ (−6) × (−2) + 3", "notice": "没有括号可优先合并后两个因数，先按从左到右的顺序计算。", "steps": [["先除", "= (−4) × (−2) + 3", "24 与 −6 异号，商为 −4。"], ["再乘", "= 8 + 3", "两个负数相乘得正。"], ["最后加", "= 11", "乘除完成后才处理加法。"]], "trap": "24 ÷ [(−6) × (−2)] + 3 是另一个算式。"}], "questions": [{"expr": "−3² + (−3)²", "answer": "0", "steps": ["−3² = −9，(−3)² = 9。", "−9 + 9 = 0。"], "calc": "-3**2+(-3)**2", "choices": null}, {"expr": "18 ÷ (−3) × (−2)", "answer": "12", "steps": ["乘除同级，从左到右。", "18 ÷ (−3) = −6；−6 × (−2) = 12。"], "calc": "18/(-3)*(-2)", "choices": null}, {"expr": "−7 − (−5) + 2", "answer": "0", "steps": ["把减法转成加法：−7 + 5 + 2。", "−7 + 7 = 0。"], "calc": "-7-(-5)+2", "choices": null}, {"expr": "下列变形正确的是", "answer": "B", "steps": ["减去一个数等于加上它的相反数。", "a − b = a + (−b)，所以选 B。"], "calc": null, "choices": ["A. a − b = b − a", "B. a − b = a + (−b)", "C. a ÷ b = b ÷ a"]}, {"expr": "12 ÷ (−2)² − 5", "answer": "-2", "steps": ["先乘方：(−2)² = 4。", "12 ÷ 4 − 5 = 3 − 5 = −2。"], "calc": "12/(-2)**2-5", "choices": null}], "summary": "第一眼找最外层结构，第二眼找抵消、配对和公因数，第三眼圈住易错负号与括号。算完用符号、数量级和项数交叉检查。"}, {"title": "带着符号移动，凑整与抵消", "short": "加法凑整", "tag": "技巧 01 · 看加数", "intro": "看到一串加减，不一定要从第一个数硬算到底。先把减法改写成加法，你就能看见每个完整的“带符号加数”。接下来用加法交换律和结合律，把互为相反数或容易凑整的数放到一起。", "paragraphs": [["先改写，才知道谁和谁配对", "例如 18 − 7 + 2 − 3，可改成 18 + (−7) + 2 + (−3)。此时四个加数分别是 18、−7、2、−3。交换位置时，−7 必须整体移动，不能只移动 7 而把负号留下。"], ["先找“和为 0”，再找“和为整数”", "互为相反数的两数相加得 0，会直接减少计算量；0.75 与 0.25、−3.6 与 −0.4 也很适合配对。配对依据是符号和数值的关系，不是看它们原来挨得近不近。"]], "lab": {"title": "动一动：给带符号的加数找搭档", "instruction": "依次观察三个算式。点击一种分组方案，看哪些加数凑成整数或 0；再说一说，为什么符号也要跟着移动。", "cases": [["18 − 7 + 2 − 3", ["(18 + 2) + (−7 − 3)", "(18 − 2) + (7 − 3)", "18 + 7 + 2 + 3"], 0, "把减法转成加法后重组：(18 + 2) + [(−7) + (−3)] = 20 − 10 = 10。每个加数的符号都保留。"], ["−6.4 + 2.8 + 6.4 − 1.8", ["(−6.4 − 6.4) + (2.8 + 1.8)", "(−6.4 + 6.4) + (2.8 − 1.8)", "−6.4 + 6.4 − 2.8 + 1.8"], 1, "−6.4 与 6.4 抵消，2.8 与 −1.8 的和为 1，原式 = 0 + 1 = 1。"], ["3/4 − 5/6 + 1/4 − 1/6", ["(3/4 − 1/4) + (5/6 − 1/6)", "3/4 + 5/6 + 1/4 + 1/6", "(3/4 + 1/4) + (−5/6 − 1/6)"], 2, "同分母分数先相加：1 + (−1) = 0。这里使用了加法交换律和结合律。"]]}, "examples": [{"title": "先抵消，再凑整", "expr": "−12.5 + 7.8 + 12.5 − 2.8", "notice": "先找互为相反数的 −12.5 与 12.5，再看剩下的小数。", "steps": [["减法转加法", "= −12.5 + 7.8 + 12.5 + (−2.8)", "现在每一项都是带符号的加数。"], ["交换并结合", "= (−12.5 + 12.5) + [7.8 + (−2.8)]", "将和为 0、和为整数的数分别成组。"], ["计算", "= 0 + 5 = 5", "先抵消再相加，计算更少。"]], "trap": "交换的是整个带符号加数，不能把 −2.8 改成 +2.8。"}, {"title": "同分母先聚到一起", "expr": "5/6 − 3/4 − 11/6 + 7/4", "notice": "先比较分母。分母相同的两项可以直接合并，不必一上来全部通分。", "steps": [["带符号分组", "= (5/6 − 11/6) + (−3/4 + 7/4)", "第二组中 −3/4 的负号不能丢。"], ["同分母相加", "= −6/6 + 4/4", "分母不变，带符号分子相加。"], ["整数相加", "= −1 + 1 = 0", "两组恰好互为相反数。"]], "trap": "分数相加不能把分母也相加。"}], "questions": [{"expr": "−8.6 + 3.7 + 8.6 − 1.7", "answer": "2", "steps": ["(−8.6 + 8.6) + (3.7 − 1.7)。", "0 + 2 = 2。"], "calc": "-8.6+3.7+8.6-1.7", "choices": null}, {"expr": "7/8 − 5/6 + 1/8 − 1/6", "answer": "0", "steps": ["(7/8 + 1/8) + (−5/6 − 1/6)。", "1 − 1 = 0。"], "calc": "7/8-5/6+1/8-1/6", "choices": null}, {"expr": "25 − 17 − 3 + 5", "answer": "10", "steps": ["先看完整加数：25、−17、−3、5。", "(25 + 5) + (−17 − 3) = 30 − 20 = 10。"], "calc": "25-17-3+5", "choices": null}, {"expr": "−2.25 + 4.6 − 0.75 − 1.6", "answer": "0", "steps": ["(−2.25 − 0.75) + (4.6 − 1.6)。", "−3 + 3 = 0。"], "calc": "-2.25+4.6-0.75-1.6", "choices": null}, {"expr": "重排 6 − 9 + 4 时，必须和 9 一起移动的是", "answer": "A", "steps": ["改写为 6 + (−9) + 4 后，完整加数是 −9。", "所以应带着负号移动。"], "calc": null, "choices": ["A. 负号", "B. 6", "C. 不需要带任何符号"]}], "summary": "减法先转加法；带符号交换与分组。优先找相反数，其次找整数，分数留意同分母。"}, {"title": "把乘法配成整十、整百", "short": "乘法配对", "tag": "技巧 02 · 看因数", "intro": "加法可以凑整，乘法也可以。25 × 4 = 100、125 × 8 = 1000、0.5 × 2 = 1，是常见的配对信号。不过算式里有除法时，要先转成乘倒数，才能自由重排因数。", "paragraphs": [["分清“乘法结合”与“擅自改除法”", "a ÷ b × c = a × (1/b) × c（b ≠ 0）。转化后才能用乘法交换律和结合律。a ÷ b ÷ c = a ÷ (bc)，但 a ÷ b × c 一般不等于 a ÷ (bc)。"], ["看不到搭档时，可以拆一个因数", "125 × 32 × 25 中，32 可以拆成 8 × 4，于是 125 配 8，25 配 4。拆分不是把乘法变成加法，而是把一个因数改写成两个数的积，整体数值不变。"]], "lab": {"title": "动一动：选择有用的配对", "instruction": "先估计哪两个数相乘最容易，再选择方案。三个算式分别练直接配对、拆因数和除法转化。", "cases": [["(−25) × 13 × 4", ["[(−25) × 4] × 13", "(−25 + 4) × 13", "(25 × 4) × 13"], 0, "用乘法交换律、结合律，−25 与 4 的积是 −100，原式 = −1300。负号保留。"], ["125 × 16 × 5", ["125 × (16 + 5)", "(125 × 8) × (2 × 5)", "125 × 8 + 2 × 5"], 1, "16 = 8 × 2，所以可以配成 1000 × 10 = 10000。因数一个也没有丢。"], ["8 ÷ (−2) × 5", ["8 ÷ [(−2) × 5]", "8 × (−2) × 5", "8 × (−1/2) × 5"], 2, "除以 −2 转为乘 −1/2，再结合：8 × (−1/2) × 5 = −4 × 5 = −20。"]]}, "examples": [{"title": "拆出两个搭档", "expr": "(−125) × 32 × (−25)", "notice": "两负相乘得正。32 能不能同时给 125 和 25 提供搭档？", "steps": [["先定符号", "= 125 × 32 × 25", "两个负因数，积为正。"], ["拆因数", "= 125 × 8 × 4 × 25", "32 = 8 × 4。"], ["交换、结合", "= (125 × 8) × (4 × 25)", "每一组都得到整十、整百或整千数。"], ["计算", "= 1000 × 100 = 100000", "把复杂乘法转成了整千乘整百。"]], "trap": "32 拆成 8 × 4，不是 8 + 4。"}, {"title": "先把除法变成乘法", "expr": "(−3/5) ÷ (−9/10) × 15", "notice": "先倒转除数 −9/10，原来的 −3/5 不倒转。", "steps": [["除法转乘法", "= (−3/5) × (−10/9) × 15", "除数的倒数是 −10/9，负号保留。"], ["确定符号并约分", "= (3 × 10 × 15)/(5 × 9)", "两负相乘得正；整体是乘积，可以约去分子分母的公因数。"], ["先简化再算", "= (1 × 2 × 5)/1 = 10", "3 与 9 约去 3，10 与 5 约去 5，再用 15 与剩下的 3 约分。"]], "trap": "只有乘积中的因数可以这样约分，和或差中的项不能直接约掉。"}], "questions": [{"expr": "(−25) × 17 × 4", "answer": "-1700", "steps": ["[(−25) × 4] × 17。", "−100 × 17 = −1700。"], "calc": "(-25)*17*4", "choices": null}, {"expr": "125 × (−16) × 5", "answer": "-10000", "steps": ["积为负，16 = 8 × 2。", "−(125 × 8) × (2 × 5) = −1000 × 10 = −10000。"], "calc": "125*(-16)*5", "choices": null}, {"expr": "(−3/4) ÷ (−9/8) × 6", "answer": "4", "steps": ["除法转乘法：(−3/4) × (−8/9) × 6。", "先约分得 2/3，再乘 6 得 4。"], "calc": "(-3/4)/(-9/8)*6", "choices": null}, {"expr": "48 ÷ (−6) × 2", "answer": "-16", "steps": ["乘除同级，从左到右，或先改成 48 × (−1/6) × 2。", "−8 × 2 = −16。"], "calc": "48/(-6)*2", "choices": null}, {"expr": "要使 0.125 × □ = 1，□ 应为", "answer": "8", "steps": ["0.125 = 1/8。", "1/8 × 8 = 1，所以填 8。"], "calc": "1/0.125", "choices": null}], "summary": "先定积的符号。除法先变乘倒数，再配对、拆因数或约分；不能把连续乘除随意加括号。"}, {"title": "分配律展开：让分母被消掉", "short": "分配律展开", "tag": "技巧 03 · 看括号", "intro": "遇到“几个分数的和或差 × 一个整数”，先观察这个整数能否被各分母整除。如果能，分配律可以让每一项分别变成整数，省去整串通分。展开之前先比较：括号内本来就容易算，还是逐项相乘更容易？", "paragraphs": [["每一项都要乘，符号跟着项走", "(a + b)c = ac + bc；减法也可先视为加上相反数，所以 (a − b)c = ac − bc。外面的因数必须分配给每一项。特别是乘负数时，括号里原来为负的项，乘积会变成正。"], ["除以同一个数，也能先转为乘倒数", "(a + b) ÷ c = a ÷ c + b ÷ c（c ≠ 0），因为可以先乘 1/c。但 a ÷ (b + c) 不能把除数拆开。分配发生在“一个数乘一个和”这一结构中，不能只看见括号就拆。"]], "lab": {"title": "动一动：选出完整的展开式", "instruction": "依次试正因数、负因数、括号作除数三个情况。先判断结构，再检查有没有漏乘或变错符号。", "cases": [["(1/3 − 1/4) × 12", ["12/3 − 12/4", "12/3 − 1/4", "12/(3 − 4)"], 0, "12 分别乘每一项：4 − 3 = 1。两个分母都能整除 12。"], ["(1/2 − 1/3) × (−6)", ["−3 − 2", "−3 + 2", "3 − 2"], 1, "1/2 × (−6) = −3；(−1/3) × (−6) = +2，所以结果是 −1。"], ["12 ÷ (1/2 + 1/3)", ["24 + 36", "12 × 2 + 12 × 3", "先求括号内的和"], 2, "括号整体是除数，不能拆。先算 1/2 + 1/3 = 5/6，再算 12 ÷ (5/6) = 72/5。"]]}, "examples": [{"title": "用公倍数逐项相乘", "expr": "(5/6 − 3/4 + 1/3) × 12", "notice": "12 能被 6、4、3 整除，逐项相乘更方便。", "steps": [["分配给每一项", "= (5/6) × 12 − (3/4) × 12 + (1/3) × 12", "中间项原来是减去 3/4，展开后仍是减去它的乘积。"], ["先约分再乘", "= 10 − 9 + 4", "12/6 = 2，12/4 = 3，12/3 = 4。"], ["加减得结果", "= 5", "避免了三个分数先通分的步骤。"]], "trap": "不能只给括号内第一项乘 12。"}, {"title": "负因数分配，逐项确定符号", "expr": "(7/12 − 5/8 − 1/6) × (−24)", "notice": "先在草稿纸预测三个乘积的符号，再计算。", "steps": [["带符号展开", "= (7/12) × (−24) + (−5/8) × (−24) + (−1/6) × (−24)", "把每一项的符号写清，减少漏号。"], ["逐项计算", "= −14 + 15 + 4", "后两项都是负负得正。"], ["相加", "= 5", "先 −14 + 15 = 1，再加 4。"]], "trap": "外面是负数时，不是“所有项都变负”，要逐项判断。"}], "questions": [{"expr": "(2/3 − 3/4 + 1/6) × 12", "answer": "1", "steps": ["12 分别乘三项。", "8 − 9 + 2 = 1。"], "calc": "(2/3-3/4+1/6)*12", "choices": null}, {"expr": "(5/6 − 1/4 − 1/3) × (−12)", "answer": "-3", "steps": ["每项都乘 −12。", "−10 + 3 + 4 = −3。"], "calc": "(5/6-1/4-1/3)*(-12)", "choices": null}, {"expr": "(3/5 − 7/10) ÷ (1/10)", "answer": "-1", "steps": ["先把除法变成乘 10。", "(3/5 − 7/10) × 10 = 6 − 7 = −1。"], "calc": "(3/5-7/10)/(1/10)", "choices": null}, {"expr": "6 ÷ (1/2 + 1/3)", "answer": "36/5", "steps": ["括号是除数，先算 1/2 + 1/3 = 5/6。", "6 ÷ (5/6) = 6 × 6/5 = 36/5。"], "calc": "6/(1/2+1/3)", "choices": null}, {"expr": "展开 (a − b)c，正确的是", "answer": "B", "steps": ["把 −b 看成一个带符号的加数。", "ac + (−b)c = ac − bc。"], "calc": null, "choices": ["A. ac − b", "B. ac − bc", "C. a − bc"]}], "summary": "整数能整除各分母时，优先考虑展开。每项都乘，逐项定符号；和在除数位置时不能拆。"}, {"title": "反用分配律：先把共同因数拿出来", "short": "提取公因数", "tag": "技巧 04 · 看相同部分", "intro": "分配律还可以反着用。两项中都有同一个因数，就可以把它提到括号外。这样常把两次较长的乘法变成一次简单乘法。观察时要找“相同因数”，不是只找看起来相同的数字。", "paragraphs": [["从两次乘法，变成一次乘法", "ab + ac = a(b + c)，ab − ac = a(b − c)。例如 3.7 × 8.2 + 3.7 × 1.8，公共因数是 3.7；提取后括号里是 8.2 + 1.8 = 10。把结果展开检查，应该能回到原式。"], ["相邻整数可以看成“整百加减 1”", "99 × a = (100 − 1)a = 100a − a；101 × a = (100 + 1)a = 100a + a。这里同样是分配律。拆分的目标是让乘法更容易，不能只记住“遇到 99 就减 1”，减去的应是 a。"]], "lab": {"title": "动一动：选出等价的提取或拆分", "instruction": "每次先说出公共因数或准备凑到的整数，再选式子。选完试着把新式子展开，核对能否回到原式。", "cases": [["6.3 × 7.4 + 6.3 × 2.6", ["6.3 × (7.4 + 2.6)", "6.3 × 6.3 × (7.4 + 2.6)", "6.3 + 7.4 + 2.6"], 0, "提取一次公共因数 6.3，括号内相加得 10，原式 = 63。"], ["(−5/7) × 18 − (−5/7) × 4", ["(−5/7) × (18 + 4)", "(−5/7) × (18 − 4)", "(5/7) × (18 − 4)"], 1, "公共因数包含负号，是 −5/7。保留两项之间的减号，得到 (−5/7) × 14 = −10。"], ["99 × 1.25", ["100 × 1.25 − 1", "100 × 1.25 + 1.25", "100 × 1.25 − 1.25"], 2, "99 = 100 − 1，因此是 125 − 1.25 = 123.75。少的是 1 份 1.25，不是少 1。"]]}, "examples": [{"title": "小数相加恰好凑成 10", "expr": "(−7.6) × 3.4 + (−7.6) × 6.6", "notice": "两个乘积都含 −7.6，而 3.4 + 6.6 恰好是 10。", "steps": [["提取共同因数", "= (−7.6) × (3.4 + 6.6)", "反用分配律，−7.6 只保留一份在括号外。"], ["先算括号", "= (−7.6) × 10", "括号内没有复杂的计算。"], ["算积", "= −76", "负数乘正数，结果为负。"]], "trap": "不能把共同因数变成 (−7.6)²。"}, {"title": "接近整数，先拆再乘", "expr": "(−99) × (7/12)", "notice": "−99 = −100 + 1。补成 −100 后，要加回 1 份。", "steps": [["拆成容易乘的数", "= (−100 + 1) × (7/12)", "−100 + 1 确实等于 −99。"], ["分配", "= −700/12 + 7/12", "同分母，合并分子。"], ["合并约分", "= −693/12 = −231/4", "也可以把 −99 与 12 先约分。本题让你比较两条合法路线。"]], "trap": "−99 应写成 −100 + 1，不能写成 −100 − 1。"}], "questions": [{"expr": "(−6.8) × 2.7 + (−6.8) × 7.3", "answer": "-68", "steps": ["提取 −6.8：(−6.8) × (2.7 + 7.3)。", "(−6.8) × 10 = −68。"], "calc": "(-6.8)*2.7+(-6.8)*7.3", "choices": null}, {"expr": "(5/9) × 17 − (5/9) × 8", "answer": "5", "steps": ["提取 5/9：(5/9) × (17 − 8)。", "(5/9) × 9 = 5。"], "calc": "(5/9)*17-(5/9)*8", "choices": null}, {"expr": "99 × (−3.25)", "answer": "-321.75", "steps": ["99 = 100 − 1。", "100 × (−3.25) − (−3.25) = −325 + 3.25 = −321.75。"], "calc": "99*(-3.25)", "choices": null}, {"expr": "101 × 2.4", "answer": "242.4", "steps": ["101 = 100 + 1。", "100 × 2.4 + 2.4 = 242.4。"], "calc": "101*2.4", "choices": null}, {"expr": "a × 7 + a × 3 中提取 a 后，括号内是", "answer": "A", "steps": ["两项共同含 a，提取后留下 7 与 3。", "a × 7 + a × 3 = a × (7 + 3)。"], "calc": null, "choices": ["A. 7 + 3", "B. 7 × 3", "C. a + 10"]}], "summary": "找同一个带符号因数，反用分配律；遇到 99、101 等数，想一想“整百减一份、加一份”。"}, {"title": "小数还是分数？看谁更好算", "short": "分数小数互化", "tag": "技巧 05 · 换一种表示", "intro": "小数与分数只是同一个数的不同写法。转换的目的，是让数之间的关系更清楚：乘除时分数便于约分，加减时有限小数有时更直接。不要一见小数就全部化分数，也不要把不能有限表示的分数随意取近似值。", "paragraphs": [["有限小数化分数，再约分", "0.25 = 25/100 = 1/4，0.125 = 125/1000 = 1/8，0.375 = 3/8，0.625 = 5/8，0.75 = 3/4。小数点后有几位，就先写成分母为 10、100、1000 等的分数。负号保留。"], ["先判断要做什么运算", "0.375 × 16，用 3/8 × 16 很方便；0.75 + 1/4，把 1/4 变成 0.25 就能口算。1/3 不能写成 0.33 来进行精确计算，因为两者不相等。你的目标是保持精确并减少计算。"]], "lab": {"title": "动一动：给运算挑一种表示", "instruction": "依次试乘法、加法和精确除法。先预测哪一种写法更便于约分或凑整，再查看反馈。", "cases": [["0.375 × 24", ["(3/8) × 24", "(375/100) × 24", "0.38 × 24"], 0, "0.375 = 3/8，24 ÷ 8 = 3，原式 = 9。约分比分别做三位小数乘法更直接。"], ["0.75 + 1/4", ["0.75 + 0.4", "0.75 + 0.25", "0.75 + 0.14"], 1, "1/4 = 0.25，因此 0.75 + 0.25 = 1。这里用小数加法很简洁。"], ["(1/3) ÷ 0.25", ["0.33 ÷ 0.25", "1 ÷ (3 + 4)", "(1/3) × 4"], 2, "0.25 = 1/4，除以 1/4 等于乘 4，所以得 4/3。用 0.33 替代 1/3 会失去精确值。"]]}, "examples": [{"title": "乘除混合，分数便于约分", "expr": "(−0.75) × (8/9) ÷ (−0.5)", "notice": "0.75 和 0.5 都有简单的分数形式。先化分数，再处理除法。", "steps": [["改写为分数", "= (−3/4) × (8/9) ÷ (−1/2)", "转换不改变数值，负号也保留。"], ["乘除数的倒数", "= (−3/4) × (8/9) × (−2)", "只有除数 −1/2 取倒数。"], ["定符号并约分", "= (3 × 8 × 2)/(4 × 9) = 4/3", "两个负因数，结果为正。3 与 9、8 与 4 可先约分。"]], "trap": "把 0.75 写成 75/10 会把数放大 10 倍。"}, {"title": "加减凑整，选小数也可以", "expr": "0.75 − 2/5 + 1/4 − 0.6", "notice": "1/4 = 0.25，2/5 = 0.4，全都可精确写成有限小数。", "steps": [["统一为小数", "= 0.75 − 0.4 + 0.25 − 0.6", "这里用小数不会产生近似误差。"], ["带符号分组", "= (0.75 + 0.25) − (0.4 + 0.6)", "两个负加数合并为减去它们绝对值的和。"], ["凑整抵消", "= 1 − 1 = 0", "也可全化分数，方法不唯一。"]], "trap": "−0.4 − 0.6 等于 −(0.4 + 0.6)，不是 −(0.4 − 0.6)。"}], "questions": [{"expr": "0.125 × (−24)", "answer": "-3", "steps": ["0.125 = 1/8。", "(1/8) × (−24) = −3。"], "calc": "0.125*(-24)", "choices": null}, {"expr": "(−0.625) ÷ (5/4)", "answer": "-1/2", "steps": ["−0.625 = −5/8；除以 5/4 等于乘 4/5。", "(−5/8) × (4/5) = −1/2。"], "calc": "(-0.625)/(5/4)", "choices": null}, {"expr": "0.375 + 1/8 − 0.5", "answer": "0", "steps": ["0.375 = 3/8，0.5 = 4/8。", "3/8 + 1/8 − 4/8 = 0。"], "calc": "0.375+1/8-0.5", "choices": null}, {"expr": "(−0.75) × (16/9)", "answer": "-4/3", "steps": ["−0.75 = −3/4。", "(−3/4) × (16/9) = −4/3。"], "calc": "(-0.75)*(16/9)", "choices": null}, {"expr": "精确计算时，1/3 能否直接换成 0.33？", "answer": "B", "steps": ["1/3 = 0.333…，并不等于 0.33。", "精确运算应保留 1/3；需要近似值时才按要求取近似。"], "calc": null, "choices": ["A. 能，两者相等", "B. 不能，两者不相等"]}], "summary": "乘除优先观察分数约分，加减优先观察凑整。互化必须保持相等，不能用近似小数代替精确分数。"}, {"title": "综合简算：乘方定形，再选方法", "short": "含乘方综合", "tag": "技巧 06 · 看整体结构", "intro": "前面的技巧要用在合法的位置。遇到乘方，不急着把所有项混在一起：先看底数和括号，求出关键的幂，再观察剩下的算式属于哪一种结构。有时两条路线都正确，选择计算量更小的那一条。", "paragraphs": [["先识别，后变形", "看见 −1 的幂，先分奇偶；看见 −a²，先确定负号是否在底数内；看见分数和乘整数，再想分配律。每写一个等号，都应能说出理由：计算、互化，还是某条运算律。"], ["不要把乘方误当分配律", "(a + b)² 一般不等于 a² + b²。例如 (2 + 3)² = 25，而 2² + 3² = 13。分配律是乘法对加法的分配，不能把平方直接分给括号内每一项。"], ["简算前，用三句话作选择", "先问：必须先处理什么？再问：哪些数能配对、约分或提出共同因数？最后问：这样变形是否始终相等？如果没有明显简便结构，就按常规顺序计算，不必强行使用技巧。"]], "lab": {"title": "动一动：选一条合法的路线", "instruction": "切换三个算式，先在纸上写出第一行等式，再选路线核对。留意“乘方优先”与“乘法分配”各自适用的位置。", "cases": [["−2² + (−1)⁵ × (3/4 − 5/6) × 12", ["先算幂，再把 12 分配给分数差", "先把 −2 和 −1 相加后乘方", "把 3/4 与 5/6 分别平方"], 0, "−2² = −4，(−1)⁵ = −1；分数差 × 12 = 9 − 10 = −1。最后 −4 + (−1) × (−1) = −3。"], ["(2 + 3)²", ["2² + 3²", "先算 2 + 3，再平方", "2 + 3²"], 1, "先算括号得 5，再算 5² = 25。平方不能直接分配到加法的两项上。"], ["(−1)²⁰ × 3/7 + (−1)²¹ × 4/7", ["把指数 20 与 21 相加", "直接算 3/7 + 4/7", "先判断两个幂的正负"], 2, "(−1)²⁰ = 1，(−1)²¹ = −1。原式 = 3/7 − 4/7 = −1/7。"]]}, "examples": [{"title": "先算幂，再用分配律", "expr": "−2² + (−1)⁵ × (3/4 − 5/6) × 12", "notice": "把算式看成两大部分：−2²，加上后面的整个乘积。", "steps": [["处理幂", "= −4 + (−1) × (3/4 − 5/6) × 12", "−2² = −4；负 1 的奇次幂是 −1。"], ["乘法结合与分配", "= −4 + (−1) × (9 − 10)", "先结合 (3/4 − 5/6) × 12，再用分配律。"], ["括号内计算", "= −4 + (−1) × (−1)", "9 − 10 = −1。"], ["先乘后加", "= −4 + 1 = −3", "末尾的两个负数相乘得正。"]], "trap": "−4 是加数，不能和后面的 12 直接配成一个乘积。"}, {"title": "小数互化与乘方一起出现", "expr": "(−0.5)² × (−8) + (5/6 − 1/3) ÷ (−1/2)", "notice": "先把两个加数各算清楚。第一部分注意平方符号，第二部分注意倒数。", "steps": [["先算幂与括号", "= (1/4) × (−8) + (1/2) ÷ (−1/2)", "(−0.5)² = 0.25 = 1/4；5/6 − 1/3 = 1/2。"], ["乘除计算", "= −2 + (−1)", "1/2 除以 −1/2 等于 1/2 × (−2) = −1。"], ["相加", "= −3", "两个负加数相加，绝对值相加并保留负号。"]], "trap": "(−0.5)² 为正；除数取倒数时，负号不能丢。"}], "questions": [{"expr": "−3² + (−1)⁴ × (2/3 − 1/6) × 12", "answer": "-3", "steps": ["先算幂：−9 + 1 × (2/3 − 1/6) × 12。", "分配得 8 − 2 = 6，最后 −9 + 6 = −3。"], "calc": "-3**2+(-1)**4*(2/3-1/6)*12", "choices": null}, {"expr": "(−0.5)² × 16 − 3", "answer": "1", "steps": ["(−0.5)² = 1/4。", "(1/4) × 16 − 3 = 4 − 3 = 1。"], "calc": "(-0.5)**2*16-3", "choices": null}, {"expr": "(−1)²⁰²⁶ × 7/9 + (−1)²⁰²⁵ × 2/9", "answer": "5/9", "steps": ["偶次幂为 1，奇次幂为 −1。", "7/9 − 2/9 = 5/9。"], "calc": "(-1)**2026*7/9+(-1)**2025*2/9", "choices": null}, {"expr": "−2³ + 0.25 × (−8) + 10", "answer": "0", "steps": ["−2³ = −8，0.25 × (−8) = −2。", "−8 − 2 + 10 = 0。"], "calc": "-2**3+0.25*(-8)+10", "choices": null}, {"expr": "(−2 + 5)² − (−2)²", "answer": "5", "steps": ["先算第一个括号：−2 + 5 = 3。", "3² − (−2)² = 9 − 4 = 5。"], "calc": "(-2+5)**2-(-2)**2", "choices": null}], "summary": "乘方先找底数与符号；再按结构选择凑整、配对、展开、提取、互化。每个等号都有依据。"}], "exit": [{"expr": "−4² + (−4)²", "answer": "0", "steps": ["−4² = −16，(−4)² = 16。", "两数互为相反数，和为 0。"], "calc": "-4**2+(-4)**2", "choices": null}, {"expr": "−3.75 + 2/3 + 1.75 + 1/3", "answer": "-1", "steps": ["(−3.75 + 1.75) + (2/3 + 1/3)。", "−2 + 1 = −1。"], "calc": "-3.75+2/3+1.75+1/3", "choices": null}, {"expr": "(−125) × 0.8 × (−4)", "answer": "400", "steps": ["两个负因数，积为正。", "125 × 0.8 × 4 = 100 × 4 = 400。"], "calc": "(-125)*0.8*(-4)", "choices": null}, {"expr": "(7/8 − 5/12 + 1/6) × (−24)", "answer": "-15", "steps": ["逐项乘 −24：−21 + 10 − 4。", "−21 + 6 = −15。"], "calc": "(7/8-5/12+1/6)*(-24)", "choices": null}, {"expr": "(−2.5) × 99 + (−2.5)", "answer": "-250", "steps": ["第二项可看成 (−2.5) × 1，提取公因数 −2.5。", "(−2.5) × (99 + 1) = −250。"], "calc": "(-2.5)*99+(-2.5)", "choices": null}, {"expr": "−2² + (−0.75) ÷ (3/8) + (−1)⁸", "answer": "-5", "steps": ["乘方得到 −4 与 1；−0.75 = −3/4。", "(−3/4) ÷ (3/8) = (−3/4) × (8/3) = −2。", "−4 − 2 + 1 = −5。"], "calc": "-2**2+(-0.75)/(3/8)+(-1)**8", "choices": null}], "tips": [[{"title": "先分块：长算式先变成两三个短任务", "signal": "最外层有加减，各部分里面又有乘除、乘方。", "method": "先圈最外层的加数，把每一块各算一行；最后合并。分块时保留块前的符号，不跨加号约分。", "expr": "−2² + (3/4 − 5/6) × 12 − 8 ÷ (−2)", "steps": ["第一块：−2² = −4", "第二块：(3/4 − 5/6) × 12 = 9 − 10 = −1", "第三块：−[8 ÷ (−2)] = −(−4) = +4", "合起来：−4 − 1 + 4 = −1"], "why": "先把注意力集中在一块上，能减少抄漏项与串顺序。最后用“原式三块，结果也三块”核对。", "trap": "8 ÷ (−2) 本身是 −4，但原式是减去这一块，所以贡献的是 +4。", "practice": "−3² + (5/6 − 1/2) × 12 − 6 ÷ (−3)", "answer": "-3", "solution": ["−9 + (10 − 6) − (−2) = −9 + 4 + 2 = −3。"], "calc": "-2**2+(3/4-5/6)*12-8/(-2)", "practiceCalc": "-3**2+(5/6-1/2)*12-6/(-3)"}, {"title": "先判符号，再估大小，给答案装一道检查", "signal": "一串乘除带多个负数，算完却不确定符号和数量级。", "method": "只在同一个非零乘除链中数负号；再用容易估的数判断结果范围。估算用于检查，不代替精确计算。", "expr": "(−19.8) × (−0.5) ÷ (−2)", "steps": ["三个负数：结果应为负", "19.8 约为 20，绝对值约为 20 × 0.5 ÷ 2 = 5", "精确算：−19.8 ÷ 4 = −4.95"], "why": "若算出 +4.95，符号错；若算出 −49.5，数量级不对。这两种检查不需要把原来的笔算重复一遍。", "trap": "有加减隔开的不同乘积，不能把全式的负号放在一起数。", "practice": "(−39.6) ÷ (−4) × (−0.5)", "answer": "-4.95", "solution": ["三个负数，积商为负；绝对值 39.6 ÷ 8 = 4.95。"], "calc": "(-19.8)*(-0.5)/(-2)", "practiceCalc": "(-39.6)/(-4)*(-0.5)"}], [{"title": "加减凑整有顺序：先抵消，再同分母，最后凑整", "signal": "正负数、小数、分数混在一个长和中。", "method": "先寻找相反数抵消；其余项优先找同分母或能合成整数的一对。不必急着把所有分数通分。", "expr": "−7.25 + 5/6 + 2.25 − 11/6", "steps": ["带符号分组：(−7.25 + 2.25) + (5/6 − 11/6)", "小数组为 −5，分数组为 −1", "原式 = −5 − 1 = −6"], "why": "同分母先合并能避免无谓通分，小数先配对能减少小数位。看“关系”，比看书写顺序更有用。", "trap": "分组时要搬动整个带符号加数，尤其不要丢掉 −11/6 的负号。", "practice": "−8.75 + 7/12 + 3.75 − 19/12", "answer": "-6", "solution": ["(−8.75 + 3.75) + (7/12 − 19/12) = −5 − 1 = −6。"], "calc": "-7.25+5/6+2.25-11/6", "practiceCalc": "-8.75+7/12+3.75-19/12"}, {"title": "带分数拆开算，负号管住整个数", "signal": "带分数很多，直接全部化假分数会使分子很大。", "method": "加减运算可把整数部分和分数部分分别组合。负带分数要拆成两个负数：负二又三分之一 = −(2 + 1/3)。", "expr": "−(2 + 1/3) + (5 + 3/4) − (3 + 2/3)", "steps": ["拆开：−2 − 1/3 + 5 + 3/4 − 3 − 2/3", "整数组：−2 + 5 − 3 = 0", "分数组：−1/3 − 2/3 + 3/4 = −1 + 3/4 = −1/4"], "why": "整数部分先凑成 0，剩下的分数也很容易配对。这里用括号表示带分数，是为了明确负号作用范围。", "trap": "−(2 + 1/3) 不是 −2 + 1/3。乘除中的带分数通常先化假分数更合适。", "practice": "−(4 + 2/5) + (7 + 1/4) − (3 + 3/5)", "answer": "-3/4", "solution": ["整数组 −4 + 7 − 3 = 0；分数组 −2/5 − 3/5 + 1/4 = −3/4。"], "calc": "-(2+1/3)+(5+3/4)-(3+2/3)", "practiceCalc": "-(4+2/5)+(7+1/4)-(3+3/5)"}], [{"title": "先约分，再相乘：不要制造大分子", "signal": "多个分数相乘，或把除法化成乘倒数后出现长乘积。", "method": "先统一成乘法，再在整个乘积的分子和分母之间约去公因数；最后乘剩下的较小整数。", "expr": "(−14/15) × (25/21) ÷ (−10/9)", "steps": ["除法转乘法：(−14/15) × (25/21) × (−9/10)", "两负得正，整体为 (14 × 25 × 9)/(15 × 21 × 10)", "14/21 = 2/3，25/15 = 5/3；再把 9 与 3 × 3 约掉", "剩下 2 × 5/10 = 1"], "why": "直接相乘会得到很大的分子分母；先约分把计算保留在较小的整数范围内，更容易核对。", "trap": "只能约乘积的因数，不能隔着加号或减号约掉某一项。", "practice": "(−8/15) × (25/12) ÷ (−10/9)", "answer": "1", "solution": ["改成乘 −9/10，两负得正；(8 × 25 × 9)/(15 × 12 × 10) = 1。"], "calc": "(-14/15)*(25/21)/(-10/9)", "practiceCalc": "(-8/15)*(25/12)/(-10/9)"}, {"title": "连续除，合并除数；夹着乘，先转倒数", "signal": "a ÷ b ÷ c 与 a ÷ b × c 看着相似，却不能同样加括号。", "method": "连续除以两个非零数，可以改成除以它们的积；中间有乘法时，先转成乘倒数再整理。", "expr": "960 ÷ 25 ÷ 4", "steps": ["两个运算都是除法：= 960 ÷ (25 × 4)", "先把除数配成 100：= 960 ÷ 100 = 9.6", "对照：960 ÷ 25 × 4 = 960 × (1/25) × 4 = 153.6"], "why": "合并连续除数的依据是 a × (1/b) × (1/c) = a ÷ (bc)。把“除、乘”误看成“除、除”，结果会变。", "trap": "除数不能为 0；“÷25×4”不能写成“÷(25×4)”。", "practice": "480 ÷ 125 ÷ 8", "answer": "0.48", "solution": ["= 480 ÷ (125 × 8) = 480 ÷ 1000 = 0.48。"], "calc": "960/25/4", "practiceCalc": "480/125/8"}], [{"title": "分母是信号：遇公倍数，考虑逐项相乘", "signal": "括号内几个分数的和或差，外面乘各分母的公倍数。", "method": "把外面的数分配给每项，让各个分母消掉；负因数要逐项定符号。", "expr": "(7/12 − 5/18 + 1/9) × (−36)", "steps": ["逐项乘：−21 + 10 − 4", "先合并容易算的项：−25 + 10", "原式 = −15"], "why": "36 能被 12、18、9 整除，每项都变成整数。省下了把整个括号先通分的工作。", "trap": "中间项原本是负的，再乘负 36 应变成正 10。", "practice": "(5/8 − 7/12 + 1/6) × (−24)", "answer": "-5", "solution": ["每项都乘 −24，得 −15 + 14 − 4 = −5。"], "calc": "(7/12-5/18+1/9)*(-36)", "practiceCalc": "(5/8-7/12+1/6)*(-24)"}, {"title": "先看括号会不会变 0、1、−1，再决定要不要展开", "signal": "括号里的数本来就能很快凑成一个特殊值。", "method": "先用几秒扫一遍：若括号内直接变 0、1、−1，先合并往往比展开更省。技巧之间也要比较成本。", "expr": "(13/17 + 4/17) × (−9.6)", "steps": ["括号内同分母：13/17 + 4/17 = 1", "原式 = 1 × (−9.6) = −9.6"], "why": "展开虽合法，却会多算两次乘法再相加。简便计算不等于“每题都用分配律”。", "trap": "选择先算括号与先展开都必须保持等价；不能为了简算省掉括号中的项。", "practice": "(11/19 + 8/19) × (−7.25)", "answer": "-7.25", "solution": ["括号内为 1，直接得 −7.25。"], "calc": "(13/17+4/17)*(-9.6)", "practiceCalc": "(11/19+8/19)*(-7.25)"}], [{"title": "把藏起来的 1 补出来，再提取", "signal": "两项里一项写成乘积，另一项只写了一个数。", "method": "单独的 a 就是 a × 1。补出 1 后再提取；若两项因数顺序不同，先交换因数。", "expr": "(−3.75) × 99 + (−3.75)", "steps": ["补出 1：(−3.75) × 99 + (−3.75) × 1", "提取：(−3.75) × (99 + 1)", "凑成 100：原式 = −375"], "why": "共同因数不是必须写在相同位置才存在，单独一项也可能藏着系数 1。", "trap": "提取后不能把单独的那一项丢掉；括号里不能只剩 99。", "practice": "(−2.4) × 101 − (−2.4)", "answer": "-240", "solution": ["补出系数 1，得 (−2.4) × (101 − 1) = −240。"], "calc": "(-3.75)*99+(-3.75)", "practiceCalc": "(-2.4)*101-(-2.4)"}, {"title": "凑整要补偿：少了几份，就补回几份", "signal": "99、101、99.8 等数离整百很近。", "method": "先写成“整百 ± 差额”，再分配。补偿的是差额乘另一个因数，不是只加减那个差额。", "expr": "99.8 × (−2.5)", "steps": ["99.8 = 100 − 0.2", "= 100 × (−2.5) − 0.2 × (−2.5)", "= −250 − (−0.5) = −249.5"], "why": "99.8 比 100 少 0.2 份，少乘的是 0.2 份 −2.5，也就是少乘 −0.5。必须减去整个负乘积。", "trap": "100 × (−2.5) − 0.2 是错的；补偿量应为 0.2 × (−2.5)。", "practice": "100.2 × (−1.25)", "answer": "-125.25", "solution": ["(100 + 0.2) × (−1.25) = −125 − 0.25 = −125.25。"], "calc": "99.8*(-2.5)", "practiceCalc": "100.2*(-1.25)"}], [{"title": "认出小数搭档：先用 8、4、2 消去分母", "signal": "0.125、0.375、0.625、0.25、0.75 出现在乘积里。", "method": "记住 0.125=1/8，0.375=3/8，0.625=5/8，0.25=1/4。先看有没有 8、4 或它们的倍数，再决定化分数。", "expr": "(−0.375) × 16 × (−1.25)", "steps": ["两负得正；0.375 = 3/8，1.25 = 5/4", "= (3/8) × 16 × (5/4)", "先约分：= 3 × 2 × 5/4 = 15/2 = 7.5"], "why": "看到 16 就能想到它与分母 8 很合适。互化的目 function questions(id){return id==='exit'?COURSE.exit:U[Number(id)].questions;}
function normalize(v){return String(v??'').normalize('NFKC').replace(/[−–﹣]/g,'-').replace(/[／⁄]/g,'/').replace(/\s+/g,'');}
function numberValue(v){v=normalize(v);const decimal='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';if(new RegExp('^'+decimal+'$').test(v)){const n=Number(v);return Number.isFinite(n)?n:NaN;}const m=v.match(new RegExp('^('+decimal+')/('+decimal+')$'));if(m){const a=Number(m[1]),b=Number(m[2]);return b!==0&&Number.isFinite(a/b)?a/b:NaN;}return NaN;}
function correct(q,v){if(normalize(v)==='')return false;if(q.choices)return normalize(v).toUpperCase()===q.answer;const a=numberValue(v),b=numberValue(q.answer);return Number.isFinite(a)&&Math.abs(a-b)<=1e-10*Math.max(1,Math.abs(b));}
function score(id,r=currentRound(id)){const qs=questions(id),ans=r.submitted||{};let good=0,blank=0;qs.forEach((q,i)=>{if(!normalize(ans[i]))blank++;else if(correct(q,ans[i]))good++;});return{good,blank,wrong:qs.length-good-blank,total:qs.length,pct:Math.round(good/qs.length*100)};}
const learned=i=>S.units[i].read&&S.units[i].summary;
const countLearned=()=>U.filter((_,i)=>learned(i)).length;
const exitPass=()=>!!currentRound('exit').submitted&&score('exit').good===COURSE.exit.length;
const finished=()=>countLearned()===U.length&&exitPass()&&S.confirmed===true;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),2600);}
function rail(){const page=S.page;$('#rail').innerHTML=`<h2>学习路线 / LEARNING PATH</h2><button class="navbtn ${page==='home'?'active':''}" data-nav="home"><span class="navnum">⌂</span>学习首页</button>${U.map((u,i)=>`<button class="navbtn ${page===`unit-${i}`||page===`summary-${i}`?'active':''}" data-nav="unit-${i}" ${page===`unit-${i}`?'aria-current="page"':''}><span class="navnum">${String(i).padStart(2,'0')}</span>${u.short}<span class="navcheck">${learned(i)?'✓':''}</span></button>`).join('')}<hr><button class="navbtn ${page==='map'?'active':''}" data-nav="map"><span class="navnum">↗</span>方法总结</button><button class="navbtn ${page==='exit'?'active':''}" data-nav="exit"><span class="navnum">◎</span>综合出门条${exitPass()?'<span class="navcheck">✓</span>':''}</button><button class="navbtn ${page==='wrong'?'active':''}" data-nav="wrong"><span class="navnum">↺</span>错题回顾</button><div class="progressbox"><span>已完成必学关卡</span><strong>${countLearned()} <span class="muted">/ ${U.length}</span></strong><div class="bar"><i style="width:${countLearned()/U.length*100}%"></i></div><span>${finished()?'本次学习完成 ✓':'读完讲解 → 检测 → 本关总结'}</span></div><p class="footer-note">一张草稿纸，一次有依据的变形。<br>进度仅保存在当前浏览器，<br>不自动跨设备同步。</p>`;}
const crumb=(a,b)=>`<div class="crumb"><span>七年级 / 有理数 / 混合运算技巧</span><span>${a}${b?' · '+b:''}</span></div>`;
function home(){const next=U.findIndex((_,i)=>!learned(i));return`${crumb('自主学习手册','01')}<div class="hero"><div><div class="eyebrow">先观察结构，再动笔计算</div><h1>算得对，<br>也要<span> </span><em>算得巧。</em></h1><p>加减乘除与乘方混在一起，<br>从哪里下手？在这里，学会看见算式里的<br>配对、抵消与共同因数。</p><div class="actions"><button class="primary" data-nav="${next>=0?'unit-'+next:'exit'}">${countLearned()?'继续学习':'从规则复习开始'} →</button><button data-nav="map">先看方法地图</button></div></div><div class="hero-art" aria-label="示例：先把小数配对凑整，再利用分配律"><div class="caption">观察一下，哪个部分可以先凑整？</div><div class="math">−7.6 × 3.4 + (−7.6) × 6.6</div><div class="note-label">↓ 提取共同因数 −7.6</div><div class="math">= −7.6 × <span style="background:#f4e5b9;border-radius:5px;padding:0 5px">(3.4 + 6.6)</span></div><div class="art-final math"><span>= −76</span><small>先凑 10，乘法变简单。</small></div></div></div><div class="stats"><div><b>6</b><span>组简算技巧</span></div><div><b>14</b><span>道分步例题</span></div><div><b>35</b><span>道随堂检测</span></div><div><b>6</b><span>道综合出门条</span></div></div><div class="guide"><strong>这样学，每一步都知道为什么</strong><ol><li>先读规律和使用条件，做一次“动一动”，比较不同变形。</li><li>例题先想第一步，再逐步展开解析；把理由写在草稿纸上。</li><li>每关独立完成 5 题，提交后订正并查看总结。做错也可以继续。</li></ol><p style="margin-top:10px">建议分几次学完，每次完成 1—2 组技巧。目标是会选择方法，不是抢速度。</p></div><div class="section-head"><h2>你的学习路线</h2><small>从规则出发，把技巧连成方法</small></div><div class="routegrid">${U.map((u,i)=>`<button class="routecard" data-nav="unit-${i}"><span class="n">${String(i).padStart(2,'0')}</span><span><strong>${u.title}</strong><small>${i===0?'符号 · 运算顺序 · 五条运算律':u.tag} ${learned(i)?' · 已学完':''}</small></span><span class="arrow">↗</span></button>`).join('')}</div><p class="footer-note">本页无需登录和联网。答案、草稿与进度自动保存在当前浏览器；换设备前可以导出学习记录。</p>`;}
function laws(){return`<h3>把“五条律”放在一起看</h3><p>这里 a、b、c 表示任意有理数。五条律包括两条加法运算律、两条乘法运算律和一条分配律；后面的技巧都能找到相应依据。</p><div class="tablewrap"><table class="lawtable"><thead><tr><th>运算律</th><th>等式</th><th>它帮你做什么</th></tr></thead><tbody>${[['加法交换律','a + b = b + a','换加数的位置'],['加法结合律','(a + b) + c = a + (b + c)','换加法的分组'],['乘法交换律','ab = ba','换因数的位置'],['乘法结合律','(ab)c = a(bc)','换乘法的分组'],['乘法分配律','a(b + c) = ab + ac','展开，或反过来提取公因数']].map(r=>`<tr><td>${r[0]}</td><td class="math">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="trap">使用范围要看清：减法、除法不能直接套交换律。例如 8 − 3 ≠ 3 − 8，8 ÷ 2 ≠ 2 ÷ 8。</div>`;}
function labHTML(i){const l=U[i].lab,s=S.units[i],ci=s.labCase,c=l.cases[ci],selected=s.lab[ci];return`<div class="section-kicker">观察实验 / 不计入检测成绩</div><h3>${l.title}</h3><p>${l.instruction}</p><div class="case-tabs" aria-label="选择观察算式">${l.cases.map((_,j)=>`<button class="${ci===j?'active':''}" data-case="${i}:${j}" aria-pressed="${ci===j}">算式 ${j+1}${s.lab[j]!==undefined?' · 已试':''}</button>`).join('')}</div><div class="math">${math(c[0])}</div><div class="options">${c[1].map((v,j)=>`<button class="option ${selected===j?'selected':''}" data-lab="${i}:${ci}:${j}" aria-pressed="${selected===j}">${math(v)}</button>`).join('')}</div>${selected!==undefined?`<div class="lab-result" role="status"><strong>${selected===c[2]?'这一步成立。':'再看一看结构。'}</strong><p>${math(c[3])}</p></div>`:`<button class="small" data-lab="${i}:${ci}:${c[2]}">暂时没思路，查看讲解</button>`}<div class="lab-foot">比较后想一想：哪些变形改变了数值？为什么正确路线始终保持相等？</div>`;}
function exampleHTML(i,j){const e=U[i].examples[j],n=Math.min(Number(S.units[i].steps[j])||0,e.steps.length);return`<div class="ex-top"><span class="badge">例题 ${j+1}</span><h3>${e.title}</h3></div><div class="math problem">${math(e.expr)}</div><div class="observe"><strong>先观察：</strong>${e.notice}</div><div class="step-list">${e.steps.slice(0,n).map((s,k)=>`<div class="step"><strong>第 ${k+1} 步 · ${s[0]}</strong><div class="math">${math(s[1])}</div><p>${math(s[2])}</p></div>`).join('')}</div><div class="actions">${n<e.steps.length?`<button class="primary small" data-step="${i}:${j}:next">${n?'看下一步':'我想过了，看第一步'} →</button><button class="small" data-step="${i}:${j}:all">展开完整解析</button>`:`<button class="small" data-step="${i}:${j}:reset">收起，再想一次</button>`}<span class="muted" style="font-size:12px">${n} / ${e.steps.length} 步</span></div>${n===e.steps.length?`<div class="trap"><strong>易错提醒：</strong>${e.trap}</div>`:''}`;}
function unit(i){const u=U[i],s=S.units[i];return`${crumb(u.tag)}<div class="eyebrow">${String(i).padStart(2,'0')} / ${i?'技巧学习':'规则复习'}</div><h1>${u.title}</h1><p class="lead">${u.intro}</p><nav class="mini-nav" aria-label="本关阅读顺序"><a href="#rules">① 读规律</a><a href="#lab-${i}">② 动一动</a><a href="#examples">③ 看例题</a><a href="#quiz">④ 自己算</a></nav><section id="rules">${u.paragraphs.map(p=>`<div class="reading"><h3>${p[0]}</h3><p>${math(p[1])}</p></div>`).join('')}${u.laws?laws():''}</section><section class="lab" id="lab-${i}">${labHTML(i)}</section><section id="examples"><div class="section-kicker"><b>③</b>先思考，再展开</div><h2>两道例题，把方法看清楚</h2><p class="muted">请先在纸上写出第一步。每看一步，都试着解释为什么两行相等，然后再往下展开。</p>${u.examples.map((_,j)=>`<article class="example" id="ex-${i}-${j}">${exampleHTML(i,j)}</article>`).join('')}</section><div class="guide"><strong>把方法说给自己听</strong><p>${u.summary}</p><div class="actions"><button class="${s.read?'':'primary'} small" data-read="${i}">${s.read?'✓ 本关讲解已读完':'我已读完讲解，开始练习'}</button></div></div><section class="exercise" id="quiz"><div class="section-kicker"><b>④</b>合上例题，拿起草稿纸</div><h2>现在，换你来算</h2><p>先写过程，再填最后结果。数值可填整数、小数或分数，例如 <strong>−3/4</strong>；不要填等式或带分数。选择题选一个答案。</p><p class="muted" style="font-size:13px">允许留空提交，未答也计入总题数。提交后显示逐题解析，可保留答案订正。</p><div id="quiz-content">${quizHTML(String(i))}</div></section><section style="margin-top:30px"><h3>留一句自己的方法</h3><label for="note-${i}" class="muted" style="font-size:14px">写下一个识别信号，或今天容易错的地方。这里不判分。</label><textarea id="note-${i}" data-note="${i}" placeholder="例如：减法先变加法，移动加数时带着符号。">${esc(s.note)}</textarea></section><div class="endrow"><button data-nav="${i?'unit-'+(i-1):'home'}">← ${i?'上一关':'学习首页'}</button><button data-nav="${i<U.length-1?'unit-'+(i+1):'map'}">${i<U.length-1?'先继续下一关':'查看方法总结'} →</button></div>`;}
function resultHTML(id,r=currentRound(id)){if(!r.submitted)return'';const a=score(id,r);const diff=JSON.stringify(r.draft)!==JSON.stringify(r.submitted);return`<div class="scorebox" role="status"><div class="scorebig">${a.good}<span style="font-size:22px"> / ${a.total}</span> <span style="font-size:20px;margin-left:15px">${a.pct}%</span></div><p>正确 ${a.good} · 答错 ${a.wrong} · 未答 ${a.blank}。正确率按本轮全部 ${a.total} 题计算。</p><small>这是最近一次提交的成绩。订正后再次提交，将更新本轮成绩。</small><div class="draftnote" id="draftNotice">${diff?'有尚未重新提交的修改。':''}</div></div>`;}
function quizHTML(id){const r=currentRound(id),qs=questions(id),rounds=id==='exit'?S.exit.rounds:S.units[Number(id)].rounds;return`${resultHTML(id)}<form id="answersForm" data-id="${id}" novalidate>${qs.map((q,j)=>{const v=r.draft[j]??'',submitted=r.submitted,ok=submitted&&correct(q,submitted[j]),blank=submitted&&!normalize(submitted[j]);return`<div class="question" id="q-${j}"><div class="qtitle"><span class="qnum">${String(j+1).padStart(2,'0')}</span><span class="math">${math(q.expr)}</span></div>${q.choices?`<div class="choices" role="group" aria-label="第 ${j+1} 题选项">${q.choices.map((c,k)=>`<label class="choice"><input type="radio" name="q${j}" data-answer="${j}" value="${String.fromCharCode(65+k)}" ${v===String.fromCharCode(65+k)?'checked':''}><span>${math(c)}</span></label>`).join('')}</div>`:`<div class="answerline"><label for="answer-${j}">最终结果</label><input class="answer" id="answer-${j}" name="q${j}" data-answer="${j}" value="${esc(v)}" autocomplete="off" spellcheck="false" placeholder="整数 / 小数 / 分数" maxlength="80"></div>`}${submitted?`<details class="feedback ${ok?'':'bad'}" ${ok?'':'open'}><summary>${ok?'✓ 正确':blank?'○ 未作答':'↺ 需要订正'} · 查看推理与计算</summary><p>上次提交：${esc(submitted[j]||'未填写')}；正确答案：<strong class="math">${math(q.answer)}</strong></p><ol>${q.steps.map(t=>`<li>${math(t)}</li>`).join('')}</ol>${id!=='exit'?`<button type="button" class="backlink" data-phase="${id}:0">回到本关规律 →</button>`:'<button type="button" class="backlink" data-nav="map">回看方法总结 →</button>'}</details>`:''}</div>`}).join('')}<div class="actions"><button type="submit" class="primary">${r.submitted?'提交订正，更新本轮':'提交本轮答案'} →</button>${id!=='exit'?`<button type="button" data-summary="${id}">查看本关总结</button>`:''}</div></form>${r.submitted?`<div class="actions"><button class="small" data-newround="${id}">同题新一轮自测</button><span class="muted" style="font-size:12px">保留本轮记录，新一轮答案为空。</span></div>`:''}${rounds.length>1?`<details class="rounds"><summary>本关共 ${rounds.length} 轮 · 查看历史提交</summary><ul>${rounds.slice(0,-1).map((rr,k)=>{const ss=score(id,rr);return`<li>第 ${k+1} 轮：${rr.submitted?`${ss.good}/${ss.total}，${ss.pct}%`:'未提交'}${rr.submitted?`<details><summary>答案与结果</summary><ol>${qs.map((q,j)=>`<li>${math(q.expr)}：${esc(rr.submitted[j]||'未答')}（${correct(q,rr.submitted[j])?'正确':'待订正'}）</li>`).join('')}</ol></details>`:''}</li>`}).join('')}</ul></details>`:''}`;}
function summary(i){const u=U[i],r=currentRound(String(i));return`${crumb('本关总结')}<div class="eyebrow">${String(i).padStart(2,'0')} / 整理与订正</div><h1>${u.short}，记住什么？</h1><div class="guide"><strong>这一关的核心方法</strong><p>${u.summary}</p></div>${r.submitted?resultHTML(String(i)):'<p class="summaryhint">这一轮还没有提交。可以先返回检测，留空也能提交；成绩不会限制进入下一关。</p>'}<h3>给下一次计算留个提醒</h3><p>${score(String(i)).good===5&&r.submitted?'这一轮五题都答对了。再回想一次：你是否能解释每个关键变形的依据？':'先回看错题和未答题的解析，找到自己在哪一步丢了符号、漏乘或选错了运算顺序。订正后提交，会更新同一轮成绩。'}</p><div class="actions"><button data-nav="unit-${i}" data-anchor="quiz">返回检测 / 订正</button><button data-nav="unit-${i}">回看讲解</button></div><div class="guide"><p>${S.units[i].read?'✓ 你已确认读完本关讲解。':'还没有标记读完讲解。返回本关阅读后，点击“我已读完讲解”。'} ${S.units[i].summary?'✓ 已查看本关总结。':''}</p></div><div class="endrow"><button data-nav="home">学习首页</button><button class="primary" data-nav="${i<U.length-1?'unit-'+(i+1):'map'}">${i<U.length-1?'继续下一关':'查看方法总结'} →</button></div>`;}
function mapHTML(){return`${crumb('把技巧连起来')}<div class="eyebrow">方法地图 / 选择比硬算更重要</div><h1>动笔前，先观察这六种信号。</h1><p class="lead">规则决定“能不能这样算”，结构决定“怎样算更省力”。一道题可以用几种方法，不必硬套某一种。</p><div class="sumtiles">${U.slice(1).map((u,k)=>`<article class="sumtile"><div class="eyebrow">0${k+1}</div><h3>${u.short}</h3><p>${u.summary}</p><button class="small" data-nav="unit-${k+1}">回看例题 →</button></article>`).join('')}</div><div class="guide"><h3>每写一个等号，问自己三件事</h3><ol><li><strong>顺序：</strong>括号、底数与乘方是否看清？</li><li><strong>结构：</strong>现在是和、积，还是商？所用运算律适用吗？</li><li><strong>检查：</strong>符号有没有丢？有没有漏项、漏乘或改了数值？</li></ol></div><div class="trap"><strong>四条边界：</strong>除数不能为 0；减除不能直接交换；平方不能直接分给和的各项；精确计算不能随意用近似小数。</div><div class="actions"><button class="primary" data-nav="exit">用综合出门条检验自己 →</button><button data-action="export">导出学习记录</button></div>`;}
function exitHTML(){const ready=countLearned()===U.length;return`${crumb('综合出门条','6 题')}<div class="eyebrow">最后一步 / 独立选择方法</div><h1>这次，不再告诉你用哪一招。</h1><p class="lead">先写出过程和所用方法，再填结果。你可以返回任意关卡复习；出门条全部答对后，确认完成本次学习。</p>${!ready?`<div class="guide"><h3>先把必学路线走完整</h3><p>还有 ${U.length-countLearned()} 关未完成“读完讲解 + 查看本关总结”。关卡检测不要求全对，下面这些入口可以继续学习。</p><div class="actions">${U.map((u,i)=>learned(i)?'':`<button class="small" data-nav="unit-${i}">${u.short} →</button>`).join('')}</div></div>`:`<div id="quiz-content">${quizHTML('exit')}</div>${exitPass()?`<div class="guide"><h3>出门条已全部答对</h3><p>回想一种你以前容易算错、现在会观察结构的方法，再点击下面的按钮完成。</p><button class="primary" data-action="finish">确认完成本次学习 ✓</button></div>`:''}`}${finished()?'<div class="complete"><div class="eyebrow" style="color:#d9e7bb">学习记录已保存</div><h2>本次学习完成 ✓</h2><p>7 关必学路线已完成，6 道综合出门条全部正确。以后再遇到长算式，先观察，再动笔。</p><div class="actions"><button data-action="export">导出我的学习记录 ↗</button><button data-nav="map">回看方法地图</button></div></div>':''}`;}
function wrongHTML(){let items=[];[...U.map((_,i)=>String(i)),'exit'].forEach(id=>{const r=currentRound(id);if(!r.submitted)return;questions(id).forEach((q,j)=>{if(!correct(q,r.submitted[j]))items.push({id,q,j,v:r.submitted[j]});});});return`${crumb('错题回顾')}<div class="eyebrow">从错误里找到下一步</div><h1>把没有想清楚的地方，再走一遍。</h1><p class="lead">显示每关当前轮次最近提交中的错题与空题。同轮订正正确后会自动移出；旧轮次仍可在各关历史记录和导出文件中查看。</p>${items.length?items.map(a=>`<article class="wrongitem"><span class="badge">${a.id==='exit'?'综合出门条':U[+a.id].short} · 第 ${a.j+1} 题</span><div class="math">${math(a.q.expr)}</div><p>上次答案：${esc(a.v||'未答')}；正确答案：${math(a.q.answer)}</p><p>${a.q.steps.map(math).join('<br>')}</p><button class="small" data-nav="${a.id==='exit'?'exit':'unit-'+a.id}" data-anchor="q-${a.j}">回到题目订正 →</button></article>`).join(''):'<div class="guide">当前没有待订正的已提交题目。尚未提交的检测不会出现在这里；继续学习时，记得独立完成并提交。</div>'}`;}
function render(scroll=true){rail();let out;const um=S.page.match(/^unit-(\d+)$/),sm=S.page.match(/^summary-(\d+)$/);if(um&&U[+um[1]])out=unit(+um[1]);else if(sm&&U[+sm[1]])out=summary(+sm[1]);else if(S.page==='map')out=mapHTML();else if(S.page==='exit')out=exitHTML();else if(S.page==='wrong')out=wrongHTML();else{S.page='home';out=home();}$('#main').innerHTML=out;$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');if(scroll){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}save();}
function go(page,anchor){S.page=page;render();if(anchor)setTimeout(()=>document.getElementById(anchor)?.scrollIntoView({block:'start'}),30);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav,b.dataset.anchor);return;}if(b.id==='menu'){const open=$('#rail').classList.toggle('open');b.setAttribute('aria-expanded',String(open));return;}if(b.dataset.case){const [i,j]=b.dataset.case.split(':').map(Number);S.units[i].labCase=j;$('#lab-'+i).innerHTML=labHTML(i);save();return;}if(b.dataset.lab){const[i,c,j]=b.dataset.lab.split(':').map(Number);S.units[i].lab[c]=j;$('#lab-'+i).innerHTML=labHTML(i);save();return;}if(b.dataset.step){const[i,j,act]=b.dataset.step.split(':');const u=S.units[+i];u.steps[j]=act==='all'?U[i].examples[j].steps.length:act==='reset'?0:(Number(u.steps[j])||0)+1;$('#ex-'+i+'-'+j).innerHTML=exampleHTML(+i,+j);save();return;}if(b.dataset.read!==undefined){const i=+b.dataset.read;S.units[i].read=true;b.textContent='✓ 本关讲解已读完';b.classList.remove('primary');save();rail();$('#quiz').scrollIntoView();return;}if(b.dataset.summary!==undefined){const i=+b.dataset.summary;if(!currentRound(String(i)).submitted){toast('请先提交本轮检测，留空也可以提交。');return;}S.units[i].summary=true;go('summary-'+i);return;}if(b.dataset.newround!==undefined){const id=b.dataset.newround;const target=id==='exit'?S.exit:S.units[+id];target.rounds.push(freshRound());if(id==='exit')S.confirmed=false;save();render(false);toast('已新建一轮同题自测，上一轮记录已保留。');return;}if(b.dataset.action==='finish'){if(countLearned()===U.length&&exitPass()){S.confirmed=true;render(false);toast('本次学习完成，记录已保存。');}return;}if(b.dataset.action==='export'){exportRecord();}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.answer!==undefined){const f=t.closest('form');if(!f)return;const r=currentRound(f.dataset.id);r.draft[t.dataset.answer]=t.value;save();const n=$('#draftNotice');if(n)n.textContent='答案已保存为草稿；提交订正后才更新成绩。';}if(t.dataset.note!==undefined){S.units[+t.dataset.note].note=t.value;save();}});
document.addEventListener('submit',e=>{if(e.target.id!=='answersForm')return;e.preventDefault();const id=e.target.dataset.id,r=currentRound(id);r.submitted={...r.draft};r.at=new Date().toISOString();if(id==='exit'&&!exitPass())S.confirmed=false;save();if(id==='exit')render(false);else{$('#quiz-content').innerHTML=quizHTML(id);rail();}$('#quiz-content').scrollIntoView({block:'start'});toast('本轮已提交，解析就在每道题下方。');});
function exportRecord(){const record={课程:'计算破局者 · 有理数混合运算技巧',导出时间:new Date().toISOString(),必学已完成:countLearned(),必学总数:U.length,本次学习完成:finished(),技巧与找错记录:S.coach,说明:'每轮正确率按全部题目计算；草稿与已提交答案分别保存。',关卡:U.map((u,i)=>({名称:u.title,讲解已读:S.units[i].read,小节已读:S.units[i].readSteps,变形观察:S.units[i].observations,总结已看:S.units[i].summary,个人笔记:S.units[i].note,探究:S.units[i].lab,轮次:S.units[i].rounds.map(r=>({提交时间:r.at,草稿:r.draft,已提交:r.submitted,成绩:r.submitted?score(String(i),r):null,题目:u.questions.map((q,j)=>({题干:q.expr,选项:q.choices,正确答案:q.answer,提交答案:r.submitted?.[j]??null,状态:!r.submitted?'未提交':!normalize(r.submitted[j])?'未答':correct(q,r.submitted[j])?'正确':'错误',解析:q.steps}))}))})),出门条:S.exit.rounds.map(r=>({提交时间:r.at,草稿:r.draft,已提交:r.submitted,成绩:r.submitted?score('exit',r):null,题目:COURSE.exit.map((q,j)=>({题干:q.expr,正确答案:q.answer,提交答案:r.submitted?.[j]??null,解析:q.steps}))}))};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='计算破局者_学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('学习记录已导出，请保管下载文件。');}

function combinedSolution(q){

function earlierRounds(key){
