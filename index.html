e complete addends first: 25, −17, −3, 5.", "重排 6 − 9 + 4 时，必须和 9 一起移动的是": "When rearranging 6 − 9 + 4, what must move with 9?", "改写为 6 + (−9) + 4 后，完整加数是 −9。": "After rewriting as 6 + (−9) + 4, the complete addend is −9.", "所以应带着负号移动。": "The minus sign must move with it.", "A. 负号": "A. The minus sign", "C. 不需要带任何符号": "C. No sign is needed", "减法先转加法；带符号交换与分组。优先找相反数，其次找整数，分数留意同分母。": "Rewrite subtraction as addition. Reorder and group signed addends. Look for opposites, then whole-number sums, and fractions with equal denominators.", "把乘法配成整十、整百": "Pair factors to make tens and hundreds", "乘法配对": "Pair factors", "技巧 02 · 看因数": "Technique 02 · Look at the factors", "加法可以凑整，乘法也可以。25 × 4 = 100、125 × 8 = 1000、0.5 × 2 = 1，是常见的配对信号。不过算式里有除法时，要先转成乘倒数，才能自由重排因数。": "Products can be made easier too: 25 × 4 = 100, 125 × 8 = 1000, and 0.5 × 2 = 1 are useful pairs. If division appears, first rewrite it as multiplication by a reciprocal before rearranging factors.", "分清“乘法结合”与“擅自改除法”": "Regrouping multiplication is not changing a divisor", "a ÷ b × c = a × (1/b) × c（b ≠ 0）。转化后才能用乘法交换律和结合律。a ÷ b ÷ c = a ÷ (bc)，但 a ÷ b × c 一般不等于 a ÷ (bc)。": "a ÷ b × c = a × (1/b) × c (b ≠ 0). Then use the commutative and associative laws of multiplication. a ÷ b ÷ c = a ÷ (bc), but a ÷ b × c is generally not equal to a ÷ (bc).", "看不到搭档时，可以拆一个因数": "If a partner is missing, split a factor", "125 × 32 × 25 中，32 可以拆成 8 × 4，于是 125 配 8，25 配 4。拆分不是把乘法变成加法，而是把一个因数改写成两个数的积，整体数值不变。": "In 125 × 32 × 25, write 32 as 8 × 4. Then pair 125 with 8 and 25 with 4. Replace a factor with an equal product, not a sum.", "动一动：选择有用的配对": "Try it: choose a useful pair", "先估计哪两个数相乘最容易，再选择方案。三个算式分别练直接配对、拆因数和除法转化。": "Predict which numbers are easiest to multiply, then choose a method. The three expressions practise direct pairing, splitting a factor, and rewriting division.", "用乘法交换律、结合律，−25 与 4 的积是 −100，原式 = −1300。负号保留。": "Using the commutative and associative laws, −25 × 4 = −100, so the result is −1300. Keep the minus sign.", "16 = 8 × 2，所以可以配成 1000 × 10 = 10000。因数一个也没有丢。": "16 = 8 × 2, giving 1000 × 10 = 10000. Every factor is still included.", "除以 −2 转为乘 −1/2，再结合：8 × (−1/2) × 5 = −4 × 5 = −20。": "Change division by −2 to multiplication by −1/2: 8 × (−1/2) × 5 = −4 × 5 = −20.", "拆出两个搭档": "Split one factor to make two partners", "两负相乘得正。32 能不能同时给 125 和 25 提供搭档？": "Two negative factors give a positive product. Can 32 provide partners for both 125 and 25?", "先定符号": "Determine the sign first", "两个负因数，积为正。": "There are two negative factors, so the product is positive.", "拆因数": "Split a factor", "交换、结合": "Reorder and associate", "每一组都得到整十、整百或整千数。": "Each group makes a multiple of ten, a hundred, or a thousand.", "把复杂乘法转成了整千乘整百。": "The product becomes an easy multiplication of thousands by hundreds.", "32 拆成 8 × 4，不是 8 + 4。": "Split 32 into 8 × 4, not 8 + 4.", "先把除法变成乘法": "Rewrite division as multiplication first", "先倒转除数 −9/10，原来的 −3/5 不倒转。": "Take the reciprocal of the divisor −9/10, not the original −3/5.", "除法转乘法": "Rewrite division as multiplication", "除数的倒数是 −10/9，负号保留。": "The reciprocal of the divisor is −10/9; keep the minus sign.", "确定符号并约分": "Determine the sign and cancel common factors", "两负相乘得正；整体是乘积，可以约去分子分母的公因数。": "Two negatives give a positive. The expression is a product, so common factors in the numerator and denominator can cancel.", "先简化再算": "Simplify before calculating", "3 与 9 约去 3，10 与 5 约去 5，再用 15 与剩下的 3 约分。": "Cancel 3 from 3 and 9, and 5 from 10 and 5; then cancel the remaining 3 against 15.", "只有乘积中的因数可以这样约分，和或差中的项不能直接约掉。": "Only factors in a product can cancel this way. You cannot directly cancel terms in a sum or difference.", "积为负，16 = 8 × 2。": "The product is negative; 16 = 8 × 2.", "除法转乘法：(−3/4) × (−8/9) × 6。": "Rewrite division: (−3/4) × (−8/9) × 6.", "先约分得 2/3，再乘 6 得 4。": "Simplify to 2/3 first, then multiply by 6 to get 4.", "乘除同级，从左到右，或先改成 48 × (−1/6) × 2。": "Work left to right, or rewrite as 48 × (−1/6) × 2 first.", "要使 0.125 × □ = 1，□ 应为": "What fills the box in 0.125 × □ = 1?", "1/8 × 8 = 1，所以填 8。": "1/8 × 8 = 1, so enter 8.", "先定积的符号。除法先变乘倒数，再配对、拆因数或约分；不能把连续乘除随意加括号。": "Determine the product's sign. Rewrite division as multiplication by a reciprocal, then pair, split or cancel factors. Do not insert brackets arbitrarily in mixed multiplication and division.", "分配律展开：让分母被消掉": "Expand with the distributive law to remove denominators", "分配律展开": "Expand products", "技巧 03 · 看括号": "Technique 03 · Look at the brackets", "遇到“几个分数的和或差 × 一个整数”，先观察这个整数能否被各分母整除。如果能，分配律可以让每一项分别变成整数，省去整串通分。展开之前先比较：括号内本来就容易算，还是逐项相乘更容易？": "When a sum or difference of fractions is multiplied by an integer, check whether each denominator divides that integer. Distributing may turn every term into an integer and save finding a common denominator. Compare this with calculating inside the brackets first.", "每一项都要乘，符号跟着项走": "Multiply every term and keep track of its sign", "(a + b)c = ac + bc；减法也可先视为加上相反数，所以 (a − b)c = ac − bc。外面的因数必须分配给每一项。特别是乘负数时，括号里原来为负的项，乘积会变成正。": "(a + b)c = ac + bc. Subtraction can be treated as adding an opposite, so (a − b)c = ac − bc. Multiply every term by the outside factor. When multiplying by a negative factor, a negative term produces a positive product.", "除以同一个数，也能先转为乘倒数": "Division by the same number can be rewritten using its reciprocal", "(a + b) ÷ c = a ÷ c + b ÷ c（c ≠ 0），因为可以先乘 1/c。但 a ÷ (b + c) 不能把除数拆开。分配发生在“一个数乘一个和”这一结构中，不能只看见括号就拆。": "(a + b) ÷ c = a ÷ c + b ÷ c (c ≠ 0), because both mean multiplying by 1/c. But a ÷ (b + c) cannot be split this way. Distribution applies to a number multiplying a sum, not to every expression with brackets.", "动一动：选出完整的展开式": "Try it: choose the complete expansion", "依次试正因数、负因数、括号作除数三个情况。先判断结构，再检查有没有漏乘或变错符号。": "Try a positive factor, a negative factor, and a bracketed divisor. Check the structure first, then look for missed terms or incorrect signs.", "12 分别乘每一项：4 − 3 = 1。两个分母都能整除 12。": "Multiply each term by 12: 4 − 3 = 1. Both denominators divide 12.", "1/2 × (−6) = −3；(−1/3) × (−6) = +2，所以结果是 −1。": "1/2 × (−6) = −3; (−1/3) × (−6) = +2, so the result is −1.", "先求括号内的和": "Calculate the sum inside the brackets first", "括号整体是除数，不能拆。先算 1/2 + 1/3 = 5/6，再算 12 ÷ (5/6) = 72/5。": "The whole bracket is the divisor, so do not split it. First 1/2 + 1/3 = 5/6, then 12 ÷ (5/6) = 72/5.", "用公倍数逐项相乘": "Multiply each term by a common multiple", "12 能被 6、4、3 整除，逐项相乘更方便。": "12 is divisible by 6, 4 and 3, so multiplying term by term is convenient.", "分配给每一项": "Distribute to every term", "中间项原来是减去 3/4，展开后仍是减去它的乘积。": "The middle term subtracts 3/4, so its product is still subtracted.", "先约分再乘": "Cancel before multiplying", "加减得结果": "Add and subtract to get the result", "避免了三个分数先通分的步骤。": "This avoids finding a common denominator for all three fractions first.", "不能只给括号内第一项乘 12。": "Do not multiply only the first term by 12.", "负因数分配，逐项确定符号": "With a negative outside factor, check every product's sign", "先在草稿纸预测三个乘积的符号，再计算。": "Predict the signs of all three products on paper before calculating.", "带符号展开": "Expand with signs attached", "把每一项的符号写清，减少漏号。": "Write each sign clearly to avoid losing one.", "逐项计算": "Calculate each term", "后两项都是负负得正。": "The last two products are positive because both factors are negative.", "相加": "Add", "先 −14 + 15 = 1，再加 4。": "First −14 + 15 = 1, then add 4.", "外面是负数时，不是“所有项都变负”，要逐项判断。": "A negative outside factor does not make every term negative. Check each product separately.", "12 分别乘三项。": "Multiply all three terms by 12.", "每项都乘 −12。": "Multiply every term by −12.", "先把除法变成乘 10。": "Rewrite division as multiplication by 10 first.", "括号是除数，先算 1/2 + 1/3 = 5/6。": "The brackets form the divisor: first calculate 1/2 + 1/3 = 5/6.", "展开 (a − b)c，正确的是": "Which expansion of (a − b)c is correct?", "把 −b 看成一个带符号的加数。": "Treat −b as a signed addend.", "整数能整除各分母时，优先考虑展开。每项都乘，逐项定符号；和在除数位置时不能拆。": "Consider expansion when the outside integer is divisible by all denominators. Multiply every term and check each sign. A sum in the divisor cannot be split this way.", "反用分配律：先把共同因数拿出来": "Use the distributive law in reverse: take out a common factor", "提取公因数": "Factor out", "技巧 04 · 看相同部分": "Technique 04 · Look for a shared factor", "分配律还可以反着用。两项中都有同一个因数，就可以把它提到括号外。这样常把两次较长的乘法变成一次简单乘法。观察时要找“相同因数”，不是只找看起来相同的数字。": "The distributive law also works backwards. If two terms share a factor, take it outside brackets. Two long multiplications may become one easy multiplication. Look for a common factor, not merely repeated digits.", "从两次乘法，变成一次乘法": "Turn two multiplications into one", "ab + ac = a(b + c)，ab − ac = a(b − c)。例如 3.7 × 8.2 + 3.7 × 1.8，公共因数是 3.7；提取后括号里是 8.2 + 1.8 = 10。把结果展开检查，应该能回到原式。": "ab + ac = a(b + c), and ab − ac = a(b − c). In 3.7 × 8.2 + 3.7 × 1.8, the common factor is 3.7 and the remaining sum is 8.2 + 1.8 = 10. Expand your answer to check that it returns to the original expression.", "相邻整数可以看成“整百加减 1”": "Think of numbers near 100 as 100 plus or minus 1", "99 × a = (100 − 1)a = 100a − a；101 × a = (100 + 1)a = 100a + a。这里同样是分配律。拆分的目标是让乘法更容易，不能只记住“遇到 99 就减 1”，减去的应是 a。": "99 × a = (100 − 1)a = 100a − a; 101 × a = (100 + 1)a = 100a + a. This is the distributive law too. The aim is easier multiplication: for 99, subtract one copy of a, not simply 1.", "动一动：选出等价的提取或拆分": "Try it: choose an equivalent factorization or split", "每次先说出公共因数或准备凑到的整数，再选式子。选完试着把新式子展开，核对能否回到原式。": "Name the common factor or the convenient integer first, then choose. Expand the new expression to check that it returns to the original.", "提取一次公共因数 6.3，括号内相加得 10，原式 = 63。": "Factor out one copy of 6.3. The bracket adds to 10, so the result is 63.", "公共因数包含负号，是 −5/7。保留两项之间的减号，得到 (−5/7) × 14 = −10。": "The common factor includes the minus sign: −5/7. Keep the subtraction between the terms to get (−5/7) × 14 = −10.", "99 = 100 − 1，因此是 125 − 1.25 = 123.75。少的是 1 份 1.25，不是少 1。": "99 = 100 − 1, so 125 − 1.25 = 123.75. Subtract one copy of 1.25, not 1.", "小数相加恰好凑成 10": "The decimals add to exactly 10", "两个乘积都含 −7.6，而 3.4 + 6.6 恰好是 10。": "Both products contain −7.6, while 3.4 + 6.6 = 10.", "提取共同因数": "Take out the common factor", "反用分配律，−7.6 只保留一份在括号外。": "Use the distributive law backwards; keep one copy of −7.6 outside the brackets.", "先算括号": "Calculate inside the brackets first", "括号内没有复杂的计算。": "The calculation inside the brackets is simple.", "算积": "Calculate the product", "负数乘正数，结果为负。": "A negative times a positive is negative.", "不能把共同因数变成 (−7.6)²。": "Do not turn the common factor into (−7.6)².", "接近整数，先拆再乘": "Near an integer? Split first, then multiply", "−99 = −100 + 1。补成 −100 后，要加回 1 份。": "−99 = −100 + 1. After changing to −100, add back one copy.", "拆成容易乘的数": "Split into numbers that are easier to multiply", "−100 + 1 确实等于 −99。": "−100 + 1 really does equal −99.", "分配": "Distribute", "同分母，合并分子。": "The denominators match, so combine the numerators.", "合并约分": "Combine and simplify", "也可以把 −99 与 12 先约分。本题让你比较两条合法路线。": "You could also cancel between −99 and 12 first. Compare these two valid methods.", "−99 应写成 −100 + 1，不能写成 −100 − 1。": "Write −99 as −100 + 1, not −100 − 1.", "提取 −6.8：(−6.8) × (2.7 + 7.3)。": "Factor out −6.8: (−6.8) × (2.7 + 7.3).", "提取 5/9：(5/9) × (17 − 8)。": "Factor out 5/9: (5/9) × (17 − 8).", "a × 7 + a × 3 中提取 a 后，括号内是": "After factoring out a from a × 7 + a × 3, what remains in the brackets?", "两项共同含 a，提取后留下 7 与 3。": "Both terms contain a; taking it out leaves 7 and 3.", "找同一个带符号因数，反用分配律；遇到 99、101 等数，想一想“整百减一份、加一份”。": "Find the same signed factor and use the distributive law backwards. For numbers such as 99 and 101, think “100 copies minus or plus one copy”.", "小数还是分数？看谁更好算": "Decimal or fraction? Choose the easier form", "分数小数互化": "Fractions and decimals", "技巧 05 · 换一种表示": "Technique 05 · Change the representation", "小数与分数只是同一个数的不同写法。转换的目的，是让数之间的关系更清楚：乘除时分数便于约分，加减时有限小数有时更直接。不要一见小数就全部化分数，也不要把不能有限表示的分数随意取近似值。": "A decimal and its equivalent fraction represent the same number. Change form to reveal useful relationships: fractions help cancellation in products and quotients; terminating decimals may simplify sums. Do not convert mechanically or replace exact fractions with rounded decimals.", "有限小数化分数，再约分": "Write a terminating decimal as a fraction, then simplify", "0.25 = 25/100 = 1/4，0.125 = 125/1000 = 1/8，0.375 = 3/8，0.625 = 5/8，0.75 = 3/4。小数点后有几位，就先写成分母为 10、100、1000 等的分数。负号保留。": "0.25 = 25/100 = 1/4; 0.125 = 125/1000 = 1/8; 0.375 = 3/8; 0.625 = 5/8; 0.75 = 3/4. The number of decimal places determines whether the denominator is 10, 100, 1000, and so on. Keep the sign.", "先判断要做什么运算": "Consider the operation first", "0.375 × 16，用 3/8 × 16 很方便；0.75 + 1/4，把 1/4 变成 0.25 就能口算。1/3 不能写成 0.33 来进行精确计算，因为两者不相等。你的目标是保持精确并减少计算。": "For 0.375 × 16, use 3/8 × 16. For 0.75 + 1/4, use 0.75 + 0.25. But 1/3 cannot be replaced by 0.33 in exact calculation: they are unequal. Aim to stay exact while reducing work.", "动一动：给运算挑一种表示": "Try it: choose a useful representation", "依次试乘法、加法和精确除法。先预测哪一种写法更便于约分或凑整，再查看反馈。": "Try multiplication, addition, and exact division. Predict which form makes cancellation or whole-number sums easier, then check the feedback.", "0.375 = 3/8，24 ÷ 8 = 3，原式 = 9。约分比分别做三位小数乘法更直接。": "0.375 = 3/8, and 24 ÷ 8 = 3, so the result is 9. Cancellation is more direct than multiplying a three-place decimal.", "1/4 = 0.25，因此 0.75 + 0.25 = 1。这里用小数加法很简洁。": "1/4 = 0.25, so 0.75 + 0.25 = 1. Decimal addition is convenient here.", "0.25 = 1/4，除以 1/4 等于乘 4，所以得 4/3。用 0.33 替代 1/3 会失去精确值。": "0.25 = 1/4, and dividing by 1/4 means multiplying by 4, giving 4/3. Replacing 1/3 by 0.33 loses the exact value.", "乘除混合，分数便于约分": "For mixed multiplication and division, fractions make cancellation easier", "0.75 和 0.5 都有简单的分数形式。先化分数，再处理除法。": "0.75 and 0.5 have simple fractional forms. Convert first, then deal with division.", "改写为分数": "Rewrite as fractions", "转换不改变数值，负号也保留。": "Changing representation keeps the value and the minus sign.", "乘除数的倒数": "Multiply by the reciprocal of the divisor", "只有除数 −1/2 取倒数。": "Only the divisor −1/2 is replaced by its reciprocal.", "定符号并约分": "Check the sign and cancel", "两个负因数，结果为正。3 与 9、8 与 4 可先约分。": "Two negative factors give a positive result. Cancel between 3 and 9, and between 8 and 4 first.", "把 0.75 写成 75/10 会把数放大 10 倍。": "Writing 0.75 as 75/10 makes it ten times too large.", "加减凑整，选小数也可以": "Decimals can help make whole-number sums", "1/4 = 0.25，2/5 = 0.4，全都可精确写成有限小数。": "1/4 = 0.25 and 2/5 = 0.4; both are exact terminating decimals.", "统一为小数": "Use decimals throughout", "这里用小数不会产生近似误差。": "These decimals introduce no rounding error.", "两个负加数合并为减去它们绝对值的和。": "Combine the two negative addends by subtracting the sum of their absolute values.", "凑整抵消": "Make whole numbers and cancel", "也可全化分数，方法不唯一。": "Converting everything to fractions would also work. There is more than one method.", "−0.4 − 0.6 等于 −(0.4 + 0.6)，不是 −(0.4 − 0.6)。": "−0.4 − 0.6 equals −(0.4 + 0.6), not −(0.4 − 0.6).", "−0.625 = −5/8；除以 5/4 等于乘 4/5。": "−0.625 = −5/8; division by 5/4 becomes multiplication by 4/5.", "精确计算时，1/3 能否直接换成 0.33？": "Can you replace 1/3 by 0.33 in an exact calculation?", "1/3 = 0.333…，并不等于 0.33。": "1/3 = 0.333…; it is not equal to 0.33.", "精确运算应保留 1/3；需要近似值时才按要求取近似。": "Keep 1/3 for exact calculation. Approximate only when requested.", "A. 能，两者相等": "A. Yes, they are equal", "B. 不能，两者不相等": "B. No, they are unequal", "乘除优先观察分数约分，加减优先观察凑整。互化必须保持相等，不能用近似小数代替精确分数。": "For products and quotients, look for cancellation using fractions. For sums and differences, look for whole-number pairs. Conversions must preserve equality; rounded decimals cannot replace exact fractions.", "综合简算：乘方定形，再选方法": "Combine techniques: handle powers, then choose a method", "含乘方综合": "Mixed expressions with powers", "技巧 06 · 看整体结构": "Technique 06 · Look at the whole structure", "前面的技巧要用在合法的位置。遇到乘方，不急着把所有项混在一起：先看底数和括号，求出关键的幂，再观察剩下的算式属于哪一种结构。有时两条路线都正确，选择计算量更小的那一条。": "Use each technique where it is valid. With powers, identify the bases and brackets first, evaluate the key powers, then inspect the remaining structure. When two methods are valid, choose the one requiring less calculation.", "先识别，后变形": "Identify the structure before rewriting", "看见 −1 的幂，先分奇偶；看见 −a²，先确定负号是否在底数内；看见分数和乘整数，再想分配律。每写一个等号，都应能说出理由：计算、互化，还是某条运算律。": "For powers of −1, check whether the exponent is odd or even. For −a², check whether the minus belongs to the base. For a sum of fractions times an integer, consider distribution. Justify each equals sign: calculation, conversion, or an operation law.", "不要把乘方误当分配律": "Do not confuse powers with the distributive law", "(a + b)² 一般不等于 a² + b²。例如 (2 + 3)² = 25，而 2² + 3² = 13。分配律是乘法对加法的分配，不能把平方直接分给括号内每一项。": "(a + b)² is generally not equal to a² + b². For example, (2 + 3)² = 25, but 2² + 3² = 13. Multiplication distributes over addition; squaring does not distribute over the terms of a sum.", "简算前，用三句话作选择": "Choose your method with three questions", "先问：必须先处理什么？再问：哪些数能配对、约分或提出共同因数？最后问：这样变形是否始终相等？如果没有明显简便结构，就按常规顺序计算，不必强行使用技巧。": "What must be handled first? Which numbers can pair, cancel, or share a factor? Does the rewriting preserve equality? If no shortcut is clear, use the usual order of operations.", "动一动：选一条合法的路线": "Try it: choose a valid route", "切换三个算式，先在纸上写出第一行等式，再选路线核对。留意“乘方优先”与“乘法分配”各自适用的位置。": "Try the three expressions. Write the first equality on paper, then choose a route. Notice where “powers first” and distribution each apply.", "先算幂，再把 12 分配给分数差": "Evaluate the powers, then distribute 12 over the fraction difference", "先把 −2 和 −1 相加后乘方": "Add −2 and −1 before taking the power", "把 3/4 与 5/6 分别平方": "Square 3/4 and 5/6 separately", "−2² = −4，(−1)⁵ = −1；分数差 × 12 = 9 − 10 = −1。最后 −4 + (−1) × (−1) = −3。": "−2² = −4 and (−1)⁵ = −1; the fraction difference times 12 is 9 − 10 = −1. Finally, −4 + (−1) × (−1) = −3.", "先算 2 + 3，再平方": "Calculate 2 + 3 first, then square", "先算括号得 5，再算 5² = 25。平方不能直接分配到加法的两项上。": "The bracket equals 5, then 5² = 25. Squaring cannot be distributed over the two addends.", "把指数 20 与 21 相加": "Add the exponents 20 and 21", "直接算 3/7 + 4/7": "Calculate 3/7 + 4/7 directly", "先判断两个幂的正负": "Determine the signs of the two powers first", "(−1)²⁰ = 1，(−1)²¹ = −1。原式 = 3/7 − 4/7 = −1/7。": "(−1)²⁰ = 1 and (−1)²¹ = −1. The expression becomes 3/7 − 4/7 = −1/7.", "先算幂，再用分配律": "Evaluate powers, then distribute", "把算式看成两大部分：−2²，加上后面的整个乘积。": "View the expression as two main parts: −2² plus the entire product that follows.", "处理幂": "Evaluate the powers", "−2² = −4；负 1 的奇次幂是 −1。": "−2² = −4; an odd power of −1 is −1.", "乘法结合与分配": "Associate and distribute multiplication", "先结合 (3/4 − 5/6) × 12，再用分配律。": "First group (3/4 − 5/6) × 12, then distribute.", "括号内计算": "Calculate inside the brackets", "先乘后加": "Multiply before adding", "末尾的两个负数相乘得正。": "The final two negative factors give a positive product.", "−4 是加数，不能和后面的 12 直接配成一个乘积。": "−4 is an addend; you cannot directly pair it with the later 12 as factors.", "小数互化与乘方一起出现": "Decimal conversions and powers together", "先把两个加数各算清楚。第一部分注意平方符号，第二部分注意倒数。": "Calculate the two addends separately. Watch the sign of the square in the first and the reciprocal in the second.", "先算幂与括号": "Evaluate powers and brackets first", "乘除计算": "Multiply and divide", "1/2 除以 −1/2 等于 1/2 × (−2) = −1。": "1/2 divided by −1/2 equals 1/2 × (−2) = −1.", "两个负加数相加，绝对值相加并保留负号。": "For two negative addends, add the absolute values and keep the minus sign.", "(−0.5)² 为正；除数取倒数时，负号不能丢。": "(−0.5)² is positive. Keep the minus sign when taking the divisor's reciprocal.", "先算幂：−9 + 1 × (2/3 − 1/6) × 12。": "Evaluate the powers: −9 + 1 × (2/3 − 1/6) × 12.", "分配得 8 − 2 = 6，最后 −9 + 6 = −3。": "Distribution gives 8 − 2 = 6; finally, −9 + 6 = −3.", "偶次幂为 1，奇次幂为 −1。": "Even powers give 1; odd powers give −1.", "先算第一个括号：−2 + 5 = 3。": "Calculate the first bracket: −2 + 5 = 3.", "乘方先找底数与符号；再按结构选择凑整、配对、展开、提取、互化。每个等号都有依据。": "Identify each power's base and sign. Then choose regrouping, pairing, expansion, factoring, or conversion to suit the structure. Justify every equals sign.", "两数互为相反数，和为 0。": "The two numbers are opposites, so their sum is 0.", "逐项乘 −24：−21 + 10 − 4。": "Multiply each term by −24: −21 + 10 − 4.", "第二项可看成 (−2.5) × 1，提取公因数 −2.5。": "The second term is (−2.5) × 1; factor out −2.5.", "乘方得到 −4 与 1；−0.75 = −3/4。": "The powers give −4 and 1; −0.75 = −3/4.", "先分块：长算式先变成两三个短任务": "Split first: turn a long expression into a few short tasks", "最外层有加减，各部分里面又有乘除、乘方。": "Outer additions and subtractions separate parts containing multiplication, division, or powers.", "先圈最外层的加数，把每一块各算一行；最后合并。分块时保留块前的符号，不跨加号约分。": "Circle the outer addends and calculate each part on a separate line. Combine them last. Keep each part's sign; never cancel across a plus sign.", "第一块：−2² = −4": "First part: −2² = −4", "第二块：(3/4 − 5/6) × 12 = 9 − 10 = −1": "Second part: (3/4 − 5/6) × 12 = 9 − 10 = −1", "第三块：−[8 ÷ (−2)] = −(−4) = +4": "Third part: −[8 ÷ (−2)] = −(−4) = +4", "合起来：−4 − 1 + 4 = −1": "Combine: −4 − 1 + 4 = −1", "先把注意力集中在一块上，能减少抄漏项与串顺序。最后用“原式三块，结果也三块”核对。": "Focusing on one part at a time reduces missed terms and order mistakes. Check that all three original parts appear in the final combination.", "8 ÷ (−2) 本身是 −4，但原式是减去这一块，所以贡献的是 +4。": "8 ÷ (−2) is −4, but the expression subtracts this part, so its contribution is +4.", "先判符号，再估大小，给答案装一道检查": "Predict the sign and size to check your answer", "一串乘除带多个负数，算完却不确定符号和数量级。": "A multiplication/division chain contains several negatives, making the result's sign and size uncertain.", "只在同一个非零乘除链中数负号；再用容易估的数判断结果范围。估算用于检查，不代替精确计算。": "Count negative operands only within one nonzero multiplication/division chain. Estimate using easy numbers to check the size. Estimation checks an exact calculation; it does not replace it.", "三个负数：结果应为负": "Three negative numbers: the result should be negative", "19.8 约为 20，绝对值约为 20 × 0.5 ÷ 2 = 5": "19.8 is about 20, so the absolute value is about 20 × 0.5 ÷ 2 = 5", "精确算：−19.8 ÷ 4 = −4.95": "Calculate exactly: −19.8 ÷ 4 = −4.95", "若算出 +4.95，符号错；若算出 −49.5，数量级不对。这两种检查不需要把原来的笔算重复一遍。": "+4.95 has the wrong sign; −49.5 has the wrong scale. These checks do not require repeating the original written calculation.", "有加减隔开的不同乘积，不能把全式的负号放在一起数。": "Do not count all minus signs together when addition or subtraction separates different products.", "三个负数，积商为负；绝对值 39.6 ÷ 8 = 4.95。": "Three negative operands give a negative result; the absolute value is 39.6 ÷ 8 = 4.95.", "加减凑整有顺序：先抵消，再同分母，最后凑整": "For sums: cancel opposites, group equal denominators, then make whole numbers", "正负数、小数、分数混在一个长和中。": "Positive and negative numbers, decimals, and fractions appear together in a long sum.", "先寻找相反数抵消；其余项优先找同分母或能合成整数的一对。不必急着把所有分数通分。": "Cancel opposites first. Then group fractions with equal denominators or pairs that make integers. There is no need to find one denominator for everything immediately.", "带符号分组：(−7.25 + 2.25) + (5/6 − 11/6)": "Group signed terms: (−7.25 + 2.25) + (5/6 − 11/6)", "小数组为 −5，分数组为 −1": "The decimal group is −5; the fraction group is −1", "原式 = −5 − 1 = −6": "The expression equals −5 − 1 = −6", "同分母先合并能避免无谓通分，小数先配对能减少小数位。看“关系”，比看书写顺序更有用。": "Equal-denominator groups avoid unnecessary conversions, while decimal pairs simplify the decimals. Relationships matter more than the original written order.", "分组时要搬动整个带符号加数，尤其不要丢掉 −11/6 的负号。": "Move the complete signed addend when grouping, especially the minus sign on −11/6.", "带分数拆开算，负号管住整个数": "Split mixed numbers, keeping the minus sign over the whole number", "带分数很多，直接全部化假分数会使分子很大。": "Many mixed numbers can produce large numerators if all are converted to improper fractions.", "加减运算可把整数部分和分数部分分别组合。负带分数要拆成两个负数：负二又三分之一 = −(2 + 1/3)。": "For addition and subtraction, group integer and fraction parts separately. A negative mixed number splits into two negative parts: negative two and one third is −(2 + 1/3).", "拆开：−2 − 1/3 + 5 + 3/4 − 3 − 2/3": "Split: −2 − 1/3 + 5 + 3/4 − 3 − 2/3", "整数组：−2 + 5 − 3 = 0": "Integer parts: −2 + 5 − 3 = 0", "分数组：−1/3 − 2/3 + 3/4 = −1 + 3/4 = −1/4": "Fraction parts: −1/3 − 2/3 + 3/4 = −1 + 3/4 = −1/4", "整数部分先凑成 0，剩下的分数也很容易配对。这里用括号表示带分数，是为了明确负号作用范围。": "The integer parts make 0, and the remaining fractions pair easily. Brackets show that the minus sign applies to the whole mixed number.", "−(2 + 1/3) 不是 −2 + 1/3。乘除中的带分数通常先化假分数更合适。": "−(2 + 1/3) is not −2 + 1/3. In products and quotients, converting mixed numbers to improper fractions is usually more useful.", "整数组 −4 + 7 − 3 = 0；分数组 −2/5 − 3/5 + 1/4 = −3/4。": "Integers: −4 + 7 − 3 = 0. Fractions: −2/5 − 3/5 + 1/4 = −3/4.", "先约分，再相乘：不要制造大分子": "Cancel before multiplying: avoid large numerators", "多个分数相乘，或把除法化成乘倒数后出现长乘积。": "Several fractions are multiplied, possibly after rewriting division using reciprocals.", "先统一成乘法，再在整个乘积的分子和分母之间约去公因数；最后乘剩下的较小整数。": "Rewrite the whole chain as multiplication. Cancel common factors between its numerator and denominator, then multiply the smaller numbers left.", "除法转乘法：(−14/15) × (25/21) × (−9/10)": "Rewrite division: (−14/15) × (25/21) × (−9/10)", "两负得正，整体为 (14 × 25 × 9)/(15 × 21 × 10)": "Two negatives give a positive: (14 × 25 × 9)/(15 × 21 × 10)", "14/21 = 2/3，25/15 = 5/3；再把 9 与 3 × 3 约掉": "14/21 = 2/3 and 25/15 = 5/3; then cancel 9 against 3 × 3", "剩下 2 × 5/10 = 1": "This leaves 2 × 5/10 = 1", "直接相乘会得到很大的分子分母；先约分把计算保留在较小的整数范围内，更容易核对。": "Multiplying immediately creates large numbers. Cancelling first keeps the arithmetic small and easier to check.", "只能约乘积的因数，不能隔着加号或减号约掉某一项。": "Cancel factors in a product only. Never cancel a term across an addition or subtraction sign.", "改成乘 −9/10，两负得正；(8 × 25 × 9)/(15 × 12 × 10) = 1。": "Multiply by −9/10. Two negatives give a positive; (8 × 25 × 9)/(15 × 12 × 10) = 1.", "连续除，合并除数；夹着乘，先转倒数": "Combine successive divisors; use reciprocals when multiplication is mixed in", "a ÷ b ÷ c 与 a ÷ b × c 看着相似，却不能同样加括号。": "a ÷ b ÷ c and a ÷ b × c look similar, but cannot be bracketed in the same way.", "连续除以两个非零数，可以改成除以它们的积；中间有乘法时，先转成乘倒数再整理。": "Dividing successively by two nonzero numbers equals dividing by their product. If multiplication is mixed in, rewrite division using reciprocals before regrouping.", "两个运算都是除法：= 960 ÷ (25 × 4)": "Both operations are division: = 960 ÷ (25 × 4)", "先把除数配成 100：= 960 ÷ 100 = 9.6": "Make the divisor 100: = 960 ÷ 100 = 9.6", "对照：960 ÷ 25 × 4 = 960 × (1/25) × 4 = 153.6": "Compare: 960 ÷ 25 × 4 = 960 × (1/25) × 4 = 153.6", "合并连续除数的依据是 a × (1/b) × (1/c) = a ÷ (bc)。把“除、乘”误看成“除、除”，结果会变。": "Combining successive divisors follows from a × (1/b) × (1/c) = a ÷ (bc). Mistaking division followed by multiplication for two divisions changes the result.", "除数不能为 0；“÷25×4”不能写成“÷(25×4)”。": "Divisors must be nonzero; “÷25×4” cannot become “÷(25×4)”.", "分母是信号：遇公倍数，考虑逐项相乘": "Denominators are a clue: distribute a common multiple", "括号内几个分数的和或差，外面乘各分母的公倍数。": "A bracketed sum or difference of fractions is multiplied by a common multiple of their denominators.", "把外面的数分配给每项，让各个分母消掉；负因数要逐项定符号。": "Distribute the outside number to every term to remove the denominators. With a negative factor, check each sign.", "逐项乘：−21 + 10 − 4": "Multiply term by term: −21 + 10 − 4", "先合并容易算的项：−25 + 10": "Combine convenient terms first: −25 + 10", "原式 = −15": "The expression equals −15", "36 能被 12、18、9 整除，每项都变成整数。省下了把整个括号先通分的工作。": "36 is divisible by 12, 18 and 9, so every term becomes an integer. This saves finding a common denominator inside the brackets first.", "中间项原本是负的，再乘负 36 应变成正 10。": "The middle term is negative; multiplying it by −36 gives positive 10.", "每项都乘 −24，得 −15 + 14 − 4 = −5。": "Multiply every term by −24: −15 + 14 − 4 = −5.", "先看括号会不会变 0、1、−1，再决定要不要展开": "Check whether the brackets make 0, 1, or −1 before expanding", "括号里的数本来就能很快凑成一个特殊值。": "The numbers inside the brackets may quickly combine to a useful special value.", "先用几秒扫一遍：若括号内直接变 0、1、−1，先合并往往比展开更省。技巧之间也要比较成本。": "Scan the brackets first. If they easily equal 0, 1, or −1, combining them may save more work than expanding. Compare the effort of different techniques.", "括号内同分母：13/17 + 4/17 = 1": "Equal denominators inside: 13/17 + 4/17 = 1", "原式 = 1 × (−9.6) = −9.6": "The expression equals 1 × (−9.6) = −9.6", "展开虽合法，却会多算两次乘法再相加。简便计算不等于“每题都用分配律”。": "Expansion is valid but requires two multiplications and an addition. Efficient calculation does not mean using distribution in every problem.", "选择先算括号与先展开都必须保持等价；不能为了简算省掉括号中的项。": "Both calculating the brackets and expanding must preserve equality. Never omit a term to create a shortcut.", "括号内为 1，直接得 −7.25。": "The brackets equal 1, so the result is −7.25.", "把藏起来的 1 补出来，再提取": "Reveal the hidden 1 before factoring", "两项里一项写成乘积，另一项只写了一个数。": "One term is written as a product; another is written as a single number.", "单独的 a 就是 a × 1。补出 1 后再提取；若两项因数顺序不同，先交换因数。": "A lone a is a × 1. Write the 1 explicitly before factoring. If factor order differs, reorder first.", "补出 1：(−3.75) × 99 + (−3.75) × 1": "Show the 1: (−3.75) × 99 + (−3.75) × 1", "提取：(−3.75) × (99 + 1)": "Factor: (−3.75) × (99 + 1)", "凑成 100：原式 = −375": "Make 100: the expression equals −375", "共同因数不是必须写在相同位置才存在，单独一项也可能藏着系数 1。": "Common factors need not appear in the same position. A single term may have a hidden coefficient of 1.", "提取后不能把单独的那一项丢掉；括号里不能只剩 99。": "Do not lose the standalone term after factoring: the brackets cannot contain only 99.", "补出系数 1，得 (−2.4) × (101 − 1) = −240。": "Show the coefficient 1: (−2.4) × (101 − 1) = −240.", "凑整要补偿：少了几份，就补回几份": "Round and compensate: adjust by the correct number of copies", "99、101、99.8 等数离整百很近。": "Numbers such as 99, 101 and 99.8 are close to 100.", "先写成“整百 ± 差额”，再分配。补偿的是差额乘另一个因数，不是只加减那个差额。": "Write “100 ± the difference”, then distribute. The adjustment is the difference times the other factor, not just the difference alone.", "99.8 比 100 少 0.2 份，少乘的是 0.2 份 −2.5，也就是少乘 −0.5。必须减去整个负乘积。": "99.8 is 0.2 below 100, so the missing product is 0.2 × (−2.5) = −0.5. Subtract that entire negative product.", "100 × (−2.5) − 0.2 是错的；补偿量应为 0.2 × (−2.5)。": "100 × (−2.5) − 0.2 is incorrect; the adjustment must be 0.2 × (−2.5).", "认出小数搭档：先用 8、4、2 消去分母": "Recognize decimal partners: use 8, 4, and 2 to cancel denominators", "0.125、0.375、0.625、0.25、0.75 出现在乘积里。": "Numbers such as 0.125, 0.375, 0.625, 0.25 and 0.75 appear in a product.", "记住 0.125=1/8，0.375=3/8，0.625=5/8，0.25=1/4。先看有没有 8、4 或它们的倍数，再决定化分数。": "Remember 0.125=1/8, 0.375=3/8, 0.625=5/8 and 0.25=1/4. Look for 8, 4, or their multiples before deciding to convert.", "两负得正；0.375 = 3/8，1.25 = 5/4": "Two negatives give a positive; 0.375 = 3/8 and 1.25 = 5/4", "先约分：= 3 × 2 × 5/4 = 15/2 = 7.5": "Cancel first: = 3 × 2 × 5/4 = 15/2 = 7.5", "看到 16 就能想到它与分母 8 很合适。互化的目标是暴露约分关系，而不是机械地把所有数换一遍。": "16 pairs well with denominator 8. Conversion should reveal cancellation, not mechanically change every number.", "0.375 = 3/8，不是 3/5；记不清时用 375/1000 约分核对。": "0.375 = 3/8, not 3/5. If unsure, simplify 375/1000 to check.", "两负得正，(5/8) × 24 × (2/5) = 6。": "Two negatives give a positive: (5/8) × 24 × (2/5) = 6.", "除数是一个和，先把它算成整体再倒转": "If the divisor is a sum, calculate it as a whole before taking its reciprocal", "除号后出现括号，里面同时有小数与分数。": "A bracket after a division sign contains both decimals and fractions.", "先统一括号内的表示，再把整个除数算出来。只有得到这个整体的值，才能正确取倒数。": "Use a consistent form inside the brackets, then calculate the entire divisor. Take the reciprocal of that complete value.", "先算整个除数：1/2 − 1/8 = 3/8": "Calculate the whole divisor: 1/2 − 1/8 = 3/8", "原式 = (−3/4) ÷ (3/8)": "The expression becomes (−3/4) ÷ (3/8)", "转乘倒数：= (−3/4) × (8/3) = −2": "Multiply by the reciprocal: = (−3/4) × (8/3) = −2", "“乘倒数”的对象是整个除数，不是括号里某一个看着方便的分数。": "Take the reciprocal of the entire divisor, not just a convenient-looking fraction inside it.", "不能把 ÷(1/2−1/8) 拆成 ÷(1/2)−÷(1/8)。": "Do not split ÷(1/2−1/8) into separate divisions by 1/2 and 1/8.", "0.625 = 5/8；括号内为 6/8 − 1/8 = 5/8，原式 = 1。": "0.625 = 5/8; the divisor is 6/8 − 1/8 = 5/8, so the result is 1.", "大指数不吓人：遇到 −1，只看奇偶": "Large exponents: for base −1, check odd or even", "(−1) 的指数很大，后面又接着分数运算。": "A power of −1 has a large exponent and is followed by fraction calculations.", "正整数次幂中，(−1) 的偶次幂为 1，奇次幂为 −1。先把这类幂变成符号，再观察分组或抵消。": "For positive integer exponents, even powers of −1 equal 1 and odd powers equal −1. Replace these powers first, then look for grouping or cancellation.", "先判奇偶：= (−1) × (7/12 − 5/18) × 36 + 11": "Check odd/even: = (−1) × (7/12 − 5/18) × 36 + 11", "分配：= (−1) × (21 − 10) + 11": "Distribute: = (−1) × (21 − 10) + 11", "指数虽然大，但这里并不带来长乘法。处理完两个幂，正好看见相反数抵消。": "A large exponent does not require long multiplication here. Evaluating the two powers reveals opposite numbers that cancel.", "这个奇偶捷径直接给出 ±1，依赖底数恰好是 −1。一般负数仍要计算绝对值的幂。": "This shortcut gives ±1 because the base is exactly −1. For other negative bases, you must still calculate the power of the absolute value.", "奇次幂为 −1，括号乘 24 得 15 − 4 = 11，结果为 −11 + 11 = 0。": "The odd power is −1; multiplying the bracket by 24 gives 15 − 4 = 11. The result is −11 + 11 = 0.", "把减号当成“整块取相反数”": "Treat a minus sign as taking the opposite of the whole part", "减号后跟一个含加减的括号，旁边还混着乘方。": "A minus sign precedes brackets containing addition and subtraction, alongside powers.", "先算括号整体，或去括号时让里面每一项都变号。写一行过渡式，比只在脑中变号可靠。": "Calculate the whole bracket first, or change every term's sign when removing it. Write an intermediate line instead of changing signs only in your head.", "先算幂：= −4 − [3 − (−8)]": "Evaluate powers first: = −4 − [3 − (−8)]", "先算方括号：= −4 − 11": "Calculate the square brackets: = −4 − 11", "先算成一个整体，外面只需要处理一次减法。若要展开，−[3−(−8)] = −3+(−8)，同样得到 −11。": "Calculating the bracket as a whole leaves only one outer subtraction. Alternatively, −[3−(−8)] = −3+(−8), which also gives −11.", "去括号不是只改变第一项符号；注意 −2² 仍为 −4。": "Removing these brackets changes every term's sign, not just the first. Remember −2² is still −4.", "负号有两种身份，别算到一半丢掉": "Minus signs have different roles: do not lose one midway", "第一行的乘方正确；第二行把正数除以负数算成了正数，错误从这里开始。": "The power in line 1 is correct. Line 2 incorrectly makes a positive divided by a negative positive; the first error is here.", "原式 = −4 − 4 = −8": "The expression equals −4 − 4 = −8", "两块都为负，最后不可能得到 0。": "Both parts are negative, so the final answer cannot be 0.", "“乘除同级”不是把后面一乘当除数": "Equal priority does not turn a later multiplication into part of the divisor", "第一行擅自把乘 −2 改成了除以 −2。后面即使算得正确，也已经是在算另一个式子。": "Line 1 changes multiplication by −2 into division by −2. Even correct later arithmetic would be evaluating a different expression.", "从左到右：24 ÷ (−6) = −4": "Left to right: 24 ÷ (−6) = −4", "再乘 −2：原式 = 8": "Then multiply by −2: the result is 8", "或者改成 24 × (−1/6) × (−2)，三个因数一起处理。": "Or rewrite as 24 × (−1/6) × (−2) and handle the three factors together.", "加数换位置，负号必须同行": "When addends change places, their minus signs must follow", "第一行把加数 −9 变成了 +9。交换的是完整加数，不是只移动数字。": "Line 1 changes the addend −9 into +9. Rearrange complete addends, not just their digits.", "重排前后逐项点名：6、−9、4，一个也不能变。": "Check each addend before and after rearranging: 6, −9, 4. None may change.", "负带分数拆开，分数部分也为负": "When splitting a negative mixed number, its fraction part is negative too", "第一行的负号只作用到了 2，没有作用到 1/3。": "In line 1 the minus sign applies to 2 but incorrectly fails to apply to 1/3.", "原式 = −2 − 1/3 + 1/3 = −2": "The expression equals −2 − 1/3 + 1/3 = −2", "把拆开的结果重新放回负号后的括号，检查是否回到原式。": "Put the split parts back inside brackets after a minus sign. Check that they reconstruct the original number.", "加号两边的项，不能直接约分": "Terms separated by addition cannot be cancelled directly", "第一行只给 9 除以 3，漏掉了 6。分子是和，除以 3 必须作用于整个和。": "Line 1 divides only 9 by 3 and misses 6. The numerator is a sum, so division by 3 must apply to the whole sum.", "先合并：15 ÷ 3 = 5": "Combine first: 15 ÷ 3 = 5", "或逐项除：6 ÷ 3 + 9 ÷ 3 = 2 + 3 = 5": "Or divide each term: 6 ÷ 3 + 9 ÷ 3 = 2 + 3 = 5", "可以约共同因数，不能“约掉和中的一项”却放过另一项。": "You may cancel a common factor, but not divide just one term in a sum while leaving the other unchanged.", "连续除法，倒数不能只取一半": "Successive division: take every required reciprocal", "第一行正确处理了第一个除法。第二行把 ÷4 改成 ×4，忘了取 4 的倒数。": "Line 1 handles the first division correctly. Line 2 changes ÷4 to ×4, forgetting the reciprocal of 4.", "每遇到一个除号，都检查后面的整个除数是否取了倒数。": "For each division sign, check that the complete divisor is replaced by its reciprocal.", "外面乘负数，负项相乘要变正": "A negative outside factor times a negative term gives a positive", "第一行展开完整；第二行的第二个乘积应为正 2，而不是负 2。": "Line 1 expands completely. In line 2, the second product should be +2, not −2.", "展开后先只写各项的正负，再写数值。": "After expanding, write each product's sign before calculating its value.", "括号在除数位置，不能逐项拆开": "A bracketed divisor cannot be split term by term", "和在除数位置，倒数不能对加法分配。第一行就改变了结构。": "The sum is the divisor; reciprocals do not distribute over addition. Line 1 already changes the structure.", "先算整个除数：1/2 + 1/3 = 5/6": "Calculate the entire divisor first: 1/2 + 1/3 = 5/6", "分清 (a+b)÷c 可以逐项除，a÷(b+c) 一般不能拆。": "Distinguish (a+b)÷c, which can be divided term by term, from a÷(b+c), which generally cannot.", "提取公因数，别漏掉隐藏的 1": "Factoring: do not lose the hidden 1", "第一行已正确补出 1；第二行把括号里的 +1 丢掉了，99+1 应为 100。": "Line 1 correctly reveals the 1. Line 2 drops the +1 from the brackets; 99+1 should be 100.", "把提取后的式子展开，应得到两个原来的项。": "Expand the factored expression: it should produce both original terms.", "凑到 100，补偿的是几份，不是几个": "When rounding to 100, compensate with copies of the other factor", "第一行应少乘 1 份 −3.25，而不是直接减 1。": "Line 1 should subtract one copy of −3.25, not simply subtract 1.", "负数乘 99 的绝对值应小于乘 100 的绝对值，不应超过 325。": "Multiplying the negative number by 99 should have a smaller absolute value than multiplying by 100; it should not exceed 325.", "小数化分数，先看小数位数": "Decimal to fraction: count the decimal places first", "0.375 有三位小数，应先写成 375/1000。第一行把数放大了 10 倍。": "0.375 has three decimal places, so begin with 375/1000. Line 1 makes the value ten times too large.", "原式 = (3/8) × 8 = 3": "The expression equals (3/8) × 8 = 3", "0.375 小于 0.5，乘 8 应小于 4，30 显然不合理。": "0.375 is less than 0.5, so multiplying by 8 should give less than 4. A result of 30 is unreasonable.", "精确分数，别中途换成近似小数": "Do not replace an exact fraction with a rounded decimal midway", "1/3 不等于 0.33。第一行用近似值替代精确值，后面会把误差带到底。": "1/3 does not equal 0.33. Line 1 introduces an approximation, and the error carries through the calculation.", "直接约分：(1/3) × 12 = 12/3": "Cancel directly: (1/3) × 12 = 12/3", "需要近似结果时按题目要求取近似；没有要求就保留精确值。": "Approximate when the question requests it. Otherwise keep exact values.", "平方不能直接分给加法的两项": "Squaring cannot be distributed over the two terms of a sum", "第一行把平方错误地分配到加法两项上。乘法分配律不是乘方对加法的分配。": "Line 1 wrongly distributes squaring over addition. The distributive law concerns multiplication, not distributing a power over a sum.", "先算括号：−2 + 5 = 3": "Calculate the brackets first: −2 + 5 = 3", "再平方：3² = 9": "Then square: 3² = 9", "用小整数代入即可检查所谓“新规律”是否成立。": "Try small integers to test whether a proposed “new rule” is valid.", "去掉减号后的括号，每一项都变号": "Removing brackets after a minus sign changes every term's sign", "第一行把括号内的 −8 仍写成 −8。减去整个括号，相当于乘 −1，应该变成 +8。": "Line 1 leaves the inner −8 unchanged. Subtracting the whole bracket is equivalent to multiplying by −1, so it should become +8.", "也可先算括号为 −5，原式 = −4 − (−5) = 1。": "Alternatively, the bracket equals −5, so −4 − (−5) = 1.", "1. 先观察": "1. Observe", "2. 再比较": "2. Compare", "3. 找原因": "3. Explain", "4. 会应用": "4. Apply", "分清符号、底数与运算顺序，知道五条运算律各能做什么。": "Identify signs, bases, and operation order, and understand the five operation laws.", "先把减法转成加法，再带着符号凑整、抵消或合并同分母分数。": "Rewrite subtraction as addition, then group signed terms to cancel, make integers, or combine equal denominators.", "看见能配对的因数，学会拆因数，并在除法转化后再约分。": "Spot useful factor pairs, split factors, and cancel after converting division to multiplication.", "识别适合展开的结构，让每一项分别相乘，注意负号与使用条件。": "Recognize when expansion helps; multiply every term and check signs and conditions.", "找出相同的带符号因数，反用分配律，把复杂乘法变简单。": "Find the same signed factor and use the distributive law backwards to simplify multiplication.", "根据约分与凑整需要选择分数或小数，保持精确相等。": "Choose fractions or decimals to help cancellation or whole-number sums while preserving exact equality.", "把乘方、符号和简算技巧连起来，独立选择计算路线。": "Connect powers, signs and shortcuts to choose your own calculation route.", "看见算式里的三个运算层次": "See three levels of operations in an expression", "原来的算式": "Original expression", "先处理乘方": "Evaluate powers first", "再乘除，后加减": "Multiply/divide, then add/subtract", "蓝色部分含乘方，紫色部分是除法。先判断各部分属于哪一级。": "The blue part contains a power; the purple part is division. Identify each part's operation level first.", "−3² = −9，负号不属于底数。紫色的除法部分暂时保持原样。": "−3² = −9: the minus sign is outside the base. Leave the purple division part unchanged for now.", "先得到紫色部分 −3，再与蓝色的 −9 相加。每一步的整个式子都等于 −12。": "The purple part gives −3, which is added to the blue −9. The entire expression equals −12 at every step.", "点击“原来的算式”，圈出乘方和除法两部分。": "Select “Original expression” and circle the power and division parts.", "点击“先处理乘方”，比较蓝色部分怎样变化。": "Select “Evaluate powers first” and compare how the blue part changes.", "点击“再乘除，后加减”，核对整个式子的值。": "Select “Multiply/divide, then add/subtract” to check the value of the whole expression.", "蓝色部分算完时，紫色部分有没有被提前相加？先分清“部分”和“整体”，混合运算就不会串步骤。": "Did you add the purple part too early while calculating the blue part? Distinguish each part from the whole to keep the steps in order.", "带着符号给加数重新分组": "Regroup addends with their signs", "看原式": "Original", "改成加法": "Rewrite as addition", "交换并分组": "Reorder and group", "先看见 18、−7、2、−3。不要只盯住数字而漏掉符号。": "Identify 18, −7, 2 and −3. Do not focus on the digits and miss the signs.", "把减法改成加法后，负号就成为加数的一部分。": "After rewriting subtraction as addition, each minus sign belongs to its addend.", "蓝色一组凑成 20，紫色一组凑成 −10，总和仍为 10。": "The blue group makes 20 and the purple group makes −10. The total is still 10.", "先看原式，说出四个带符号的加数。": "Read the original expression and name the four signed addends.", "点击“改成加法”，检查 −7 与 −3 的符号。": "Select “Rewrite as addition” and check the signs of −7 and −3.", "点击“交换并分组”，比较两组的和，再记录。": "Select “Reorder and group”, compare the two sums, then record your observation.", "移动之前和之后，加数有没有少一个、符号有没有变？只有分组变了，原式的值没有变。": "Was any addend lost or any sign changed? Only the grouping changed; the expression's value stayed the same.", "把能凑成整百的两个因数放一起": "Bring together the two factors that make a hundred", "看三个因数": "View three factors", "交换位置": "Change positions", "先算一组": "Calculate one pair", "负因数有一个，先预测整个积应为负。": "There is one negative factor. Predict a negative product.", "把 4 移到 −25 的旁边。13 仍然保留，运算仍是乘法。": "Move 4 beside −25. Keep 13; the operations are still multiplication.", "先结合 −25 与 4 得 −100，再乘 13，比先算 −25 × 13 更直接。": "Grouping −25 and 4 makes −100, then multiply by 13. This is easier than calculating −25 × 13 first.", "预测积的正负，并找出最容易相乘的一对。": "Predict the sign and identify the easiest pair to multiply.", "点击“交换位置”，观察哪些因数换了位置。": "Select “Change positions” and observe which factors moved.", "点击“先算一组”，核对 −100 是怎样得到的。": "Select “Calculate one pair” and check where −100 comes from.", "交换位置不会改变因数；结合只改变先算哪一组。如果原来有除法，还要先把它变成乘倒数。": "Reordering does not change the factors; association changes which group is evaluated first. Rewrite any division as multiplication by a reciprocal before regrouping.", "把 12 分配给每一个分数": "Distribute 12 to every fraction", "看分母": "Look at denominators", "逐项展开": "Expand term by term", "约分后计算": "Cancel, then calculate", "分母 6、4、3 都能整除 12，所以逐项相乘有望更容易。": "6, 4 and 3 all divide 12, so multiplying term by term may be easier.", "12 出现了三次：每一项各乘一次。减号留在中间一项前。": "12 appears three times, once for each term. Keep the minus sign before the middle term.", "每个分数与 12 相乘都成了整数。现在只需算 10 − 9 + 4。": "Each fraction times 12 becomes an integer. Now calculate 10 − 9 + 4.", "先检查：12 能否被每个分母整除？": "Check first: is 12 divisible by every denominator?", "点击“逐项展开”，数一数 12 出现了几次。": "Select “Expand term by term” and count how many times 12 appears.", "点击“约分后计算”，逐项核对 10、−9、4。": "Select “Cancel, then calculate” and check 10, −9 and 4 separately.", "若只给第一项乘 12，后两项就没有保持原来的乘积。分配律的重点是“每一项都乘”。": "Multiplying only the first term by 12 changes the other two products. The key is to multiply every term.", "从两个乘积里找出同一个因数": "Find the same factor in both products", "找相同部分": "Find the common part", "先把括号凑整": "Make a whole number inside", "两项都含因数 −7.6；3.4 和 6.6 恰好可以凑成 10。": "Both terms contain −7.6, and 3.4 + 6.6 = 10.", "外面只保留一份共同因数，括号中留下两个不同的因数。": "Keep one common factor outside; the two remaining factors stay inside the brackets.", "先算括号里的和，原来的两次小数乘法变成一次乘 10。": "Calculate the bracketed sum first. Two decimal multiplications become one multiplication by 10.", "读出两个乘积里相同的带符号因数。": "Name the common signed factor in the two products.", "点击“提取共同因数”，检查括号内留下谁。": "Select “Take out the common factor” and check what remains in the brackets.", "点击“先把括号凑整”，再反过来想一想能否展开回原式。": "Select “Make a whole number inside”, then check whether expanding would recover the original expression.", "共同因数并没有被乘两遍。提取后再展开，应该完整得到原来的两个乘积。": "The common factor is not multiplied twice. Expanding after factoring should recover both original products completely.", "换一种写法，让约分关系显出来": "Change form to reveal cancellation", "原来的小数": "Original decimals", "精确化成分数": "Convert to exact fractions", "−0.75 与 −0.5 都能用简单分数精确表示。": "−0.75 and −0.5 both have simple exact fractional forms.", "小数改写成分数，数值不变。负号要保留。": "Rewriting decimals as fractions preserves their values. Keep the minus signs.", "只有除数取倒数。两个负因数使积为正，约分可得 4/3。": "Only the divisor takes its reciprocal. Two negative factors give a positive product; cancellation gives 4/3.", "先说出 0.75 与 0.5 对应的最简分数。": "State the simplest fractions equal to 0.75 and 0.5.", "点击“精确化成分数”，检查负号与分母。": "Select “Convert to exact fractions” and check signs and denominators.", "点击“除法转乘法”，指出哪个数取了倒数。": "Select “Rewrite division as multiplication” and identify which number takes its reciprocal.", "比较三种写法：换的是表示形式，数值始终不变。能约分并不意味着可以随意取近似值。": "Compare the three forms: the representation changes, but the value stays equal. Cancellation does not permit arbitrary rounding.", "先处理幂，再看剩下的结构": "Handle powers, then inspect the remaining structure", "划分两大部分": "Identify two main parts", "先算两个幂": "Evaluate both powers", "用分配律简算": "Simplify by distribution", "加号把算式分成两部分，蓝色的 −2² 不能与末尾的 12 直接相乘。": "The plus sign separates two parts. The blue −2² cannot be directly multiplied by the final 12.", "−2² = −4，(−1)⁵ = −1；后面的分数差还可以简算。": "−2² = −4 and (−1)⁵ = −1; the following fraction difference can still be simplified.", "把 12 分配给分数差，得到 9 − 10 = −1。原式为 −4 + 1 = −3。": "Distribute 12 to get 9 − 10 = −1. The whole expression is −4 + 1 = −3.", "先圈出两个幂，分别判断底数与正负。": "Circle the two powers and identify their bases and signs.", "点击“先算两个幂”，检查蓝色的 −4 从哪里来。": "Select “Evaluate both powers” and check where the blue −4 comes from.", "点击“用分配律简算”，说明 12 分配给了哪个括号。": "Select “Simplify by distribution” and explain which bracket receives the factor 12.", "每个技巧都有自己的使用范围。先保留算式的加法结构，再在后面的乘积内部简算。": "Each technique has a valid scope. Preserve the outer addition and simplify within the later product.", "为什么 −3² 不能算成 9？": "Why is −3² not 9?", "因为负号不在底数里，先算 3² 再取相反数": "The minus is outside the base: calculate 3², then take its opposite", "因为负数乘负数为负": "Because a negative times a negative is negative", "因为乘方要最后算": "Because powers are evaluated last", "−3² 表示 −(3²)，底数是 3。只有写成 (−3)²，负号才属于底数，结果才是 9。": "−3² means −(3²), with base 3. Only in (−3)² does the minus belong to the base, giving 9.", "例题中 −2² 与 (−2)³，为什么不能把负号一起省去？": "Why cannot the minus signs in −2² and (−2)³ both be omitted?", "两项都要变正": "Both terms must become positive", "底数和指数不同，要分别判断符号": "Their bases and exponents differ, so check each sign separately", "只看数字 2 就够了": "It is enough to look only at the digit 2", "−2² 的负号在乘方外；(−2)³ 是三个负数相乘，结果也为负，但理由不同。不能把两种写法混同。": "The minus in −2² is outside the power. (−2)³ multiplies three negatives. Both are negative for different reasons; do not confuse the two forms.", "24 ÷ (−6) × (−2) 的前两步应怎样处理？": "What are the first two steps for 24 ÷ (−6) × (−2)?", "先算 (−6) × (−2)": "Calculate (−6) × (−2) first", "从左到右先除后乘": "Work left to right: divide, then multiply", "先把 24 和 −2 相加": "Add 24 and −2 first", "乘除同级。按原式从左到右，先得 −4，再乘 −2 得 8。也可以先转乘倒数，但不能擅自改变除数。": "Multiplication and division have equal priority. Working left to right gives −4, then 8. Rewriting using reciprocals is valid; changing the divisor arbitrarily is not.", "把 −7 移到别的位置时，必须保留什么？": "What must be preserved when moving −7?", "只保留 7": "Only the digit 7", "把它变成 +7": "Change it to +7", "负号与数字一起移动": "Move the minus sign with the number", "改成加法后，−7 是一个完整加数。交换律改变加数的位置，不改变加数本身。": "After rewriting as addition, −7 is one complete addend. The commutative law changes its position, not its value.", "例题先把 −12.5 与 12.5 配对，目的是？": "Why pair −12.5 with 12.5 first?", "互为相反数，先得到 0": "They are opposites and add to 0", "先把符号全部变正": "To make all signs positive first", "让每项都变成小数": "To turn every term into a decimal", "这一对相加为 0，剩下 7.8 − 2.8，直接得到 5。先抵消会减少后面的计算。": "This pair adds to 0, leaving 7.8 − 2.8 = 5. Cancelling first reduces the work.", "分数例题按什么信号分组？": "What clue determines the grouping in the fraction example?", "分子最大的先算": "Calculate the largest numerator first", "同分母的项放一起，并带着符号": "Group terms with equal denominators and keep their signs", "先把所有分母相加": "Add all the denominators first", "5/6 与 −11/6 同分母，−3/4 与 7/4 同分母。各组先合并，不必一开始就全部通分。": "5/6 and −11/6 share a denominator; so do −3/4 and 7/4. Combine each pair first instead of finding a denominator for everything.", "这里交换 13 与 4 的位置，为什么成立？": "Why can 13 and 4 change positions here?", "乘法交换律适用于这些因数": "The commutative law of multiplication applies to these factors", "任何除法都能直接交换": "Any division can be reordered directly", "只要结果较简单就可以": "It is valid whenever the result looks simpler", "算式由乘法连接，可以用交换律，再用结合律让 −25 与 4 先算。计算变简单必须以等价为前提。": "The factors are linked by multiplication. Reorder them, then associate −25 and 4. Simplification must preserve equality.", "为了让 125 与 25 都有搭档，32 应拆成？": "How should 32 be split to give partners to both 125 and 25?", "16 + 16 后直接省去加号": "Write 16 + 16, then simply remove the plus sign", "125 配 8，25 配 4。32 = 8 × 4，拆分后仍然是同一个乘积。": "Pair 125 with 8 and 25 with 4. Since 32 = 8 × 4, the product remains unchanged.", "除以 −9/10，应改为乘哪个数？": "Dividing by −9/10 means multiplying by which number?", "除以非零数等于乘它的倒数。取倒数只交换分子、分母，负号保留。": "Dividing by a nonzero number means multiplying by its reciprocal. Swap numerator and denominator and keep the minus sign.", "展开时，外面的 12 应乘哪些项？": "Which terms should be multiplied by the outside 12?", "只乘第一项": "Only the first term", "括号内每一项都乘": "Every term inside the brackets", "只乘正的项": "Only the positive terms", "整个和乘 12，等于每一项分别乘 12 再相加，负项也要完整保留。漏乘就改变了数值。": "Multiplying a sum by 12 means multiplying each term by 12 and adding. Keep negative terms too. Missing a term changes the value.", "为什么例题选择先展开？": "Why does the example expand first?", "12 能被每个分母整除，逐项乘后都是整数": "Every denominator divides 12, so each product is an integer", "有括号必须展开": "All brackets must be expanded", "分配律可以把分母相加": "The distributive law lets us add denominators", "这道题的结构适合分配律。若括号内本来很容易相加，也可先算括号；不是见括号就展开。": "This structure suits distribution. If the bracketed sum is already easy, calculate it first. Brackets do not always call for expansion.", "(−5/8) × (−24) 的乘积为什么是 +15？": "Why does (−5/8) × (−24) equal +15?", "负负相乘得正，再算绝对值": "Two negative factors give a positive; then calculate the absolute value", "减号可以随意去掉": "Minus signs can be removed freely", "所有分数乘整数都为正": "Any fraction times an integer is positive", "两个负数相乘得正，24 ÷ 8 × 5 = 15。外部负因数要逐项判断符号。": "Two negatives give a positive, and 24 ÷ 8 × 5 = 15. With a negative outside factor, check each term's sign.", "提取 −7.6 后，为什么括号内是 3.4 + 6.6？": "Why does factoring out −7.6 leave 3.4 + 6.6?", "原式两项相加，分别留下另一个因数": "The original terms are added; the other factor from each remains", "因为两个小数一律相加": "Because any two decimals must be added", "因为共同因数要平方": "Because the common factor must be squared", "反向检查：(−7.6)(3.4+6.6) 展开就是原式。运算符和每项剩下的因数都保留了。": "Check backwards: expanding (−7.6)(3.4+6.6) gives the original expression. The operation and both remaining factors are preserved.", "提取共同因数后，计算更简单的关键是？": "What makes the calculation easier after factoring?", "负号都被消掉了": "All the minus signs disappear", "乘法变成了平方": "Multiplication turns into squaring", "并不是提取本身带来答案，而是提取后出现了容易计算的括号。最后仍要保留 −7.6 的负号。": "Factoring reveals an easy bracketed sum. The minus sign on −7.6 still has to be kept in the final multiplication.", "−99 为什么写成 −100 + 1？": "Why write −99 as −100 + 1?", "−100 再减少 1 就是 −99": "Decreasing −100 by 1 gives −99", "−100 向上补回 1 才是 −99": "Adding 1 back to −100 gives −99", "正负号不影响拆分": "Signs do not affect the split", "−100 + 1 = −99。所以乘 7/12 后应加回一份 7/12，而不是再减一份。": "−100 + 1 = −99, so after multiplying by 7/12, add back one copy of 7/12 rather than subtracting another.", "化分数后，哪个数需要取倒数？": "After converting to fractions, which number needs its reciprocal?", "第一个数 −3/4": "The first number, −3/4", "中间因数 8/9": "The middle factor, 8/9", "除数 −1/2": "The divisor, −1/2", "“除以 −1/2”整体改成“乘 −2”，其他因数保持原值。": "Replace “divide by −1/2” with “multiply by −2”. Other factors retain their values.", "这道乘除题化成分数的主要作用是？": "What is the main benefit of fractions in this product/quotient?", "能够先约分，减少计算": "They allow cancellation first, reducing the arithmetic", "必须让所有答案变成整数": "Every answer must become an integer", "为了把负号去掉": "They remove minus signs", "3、4、8、9、2 之间的约分关系更清楚。结果仍是精确的 4/3。": "Cancellation among 3, 4, 8, 9 and 2 is clearer. The result remains the exact value 4/3.", "0.75 − 2/5 + 1/4 − 0.6 为什么也适合化成小数？": "Why is 0.75 − 2/5 + 1/4 − 0.6 also suitable for decimals?", "任意分数都可以用两位小数精确表示": "Every fraction can be represented exactly with two decimal places", "2/5 与 1/4 都能精确化成有限小数，并且能凑整": "2/5 and 1/4 are exact terminating decimals that form whole-number sums", "小数计算不需要看符号": "Decimal calculations do not need sign checks", "2/5 = 0.4，1/4 = 0.25，正数凑成 1，负加数之和为 −1。此时用小数很直接。": "2/5 = 0.4 and 1/4 = 0.25. The positive terms make 1, and the negatives make −1. Decimals work directly here.", "最后的 12 能直接和前面的 −4 相乘吗？": "Can the final 12 directly multiply the earlier −4?", "能，都是整数": "Yes, both are integers", "不能，−4 与后面的乘积是相加关系": "No, −4 is added to the following product", "只要先改符号就可以": "Yes, if we change the sign first", "−4 是前面的加数，12 属于后面的乘积。乘法交换律只能在同一个乘积内部使用。": "−4 is an addend; 12 belongs to the later product. The commutative law of multiplication works only within the same product.", "先算两个幂以后，下一步选分配律的依据是？": "After evaluating both powers, why choose distribution next?", "12 能整除括号内分数的分母": "12 is divisible by the denominators inside the brackets", "分配律必须最先用": "The distributive law must always be used first", "平方都能直接分配": "All squares can be distributed directly", "先在后面的乘积里结合分数差与 12，再展开得 9 − 10。没有改变前面的加法结构。": "Within the later product, group the fraction difference with 12, then expand to 9 − 10. The outer addition remains unchanged.", "(−0.5)² 与 (1/2) ÷ (−1/2) 的符号分别是？": "What are the signs of (−0.5)² and (1/2) ÷ (−1/2), respectively?", "负、负": "Negative, negative", "正、正": "Positive, positive", "正、负": "Positive, negative", "负数的平方为正；正数除以负数为负。先分别算清两大部分，再相加。": "The square of a negative is positive; a positive divided by a negative is negative. Calculate the two main parts separately, then add.", "先分块，再找捷径，最后用符号、项数与数量级检查结果。": "Split into parts, find a shortcut, then check signs, term count and approximate size.", "按抵消、同分母、凑整的顺序配对，学会拆带分数并管住负号。": "Cancel opposites, group equal denominators, and make whole numbers. Split mixed numbers while keeping their signs.", "先约分避免大分子，分清连续除法与乘除混合的整理方法。": "Cancel first to avoid large numerators. Distinguish successive division from mixed multiplication and division.", "公倍数适合展开，括号能变 0、1、−1 时先合并，选更省力的路线。": "Expand with common multiples; combine brackets first if they make 0, 1 or −1. Choose the easier route.", "补出隐藏的 ×1，识别共同因数，凑整时算清补偿的是几份。": "Reveal hidden ×1 factors, identify shared factors, and calculate the correct compensation when rounding.", "认出常用小数的分数搭档，把除数当整体，保持精确运算。": "Recognize familiar decimal–fraction pairs, treat each divisor as a whole, and keep calculations exact.", "大指数看特殊底数，复杂括号分块处理，找出最先出错的那一步。": "Use special bases for large exponents, split complex brackets into parts, and locate the first incorrect step.", "先分成三块，分别处理后再合并": "Split into three parts, calculate separately, then combine", "圈出三个块": "Circle the three parts", "分别算每块": "Calculate each part", "按原来的符号合并": "Combine using the original signs", "蓝色块是负的平方，紫色块可以分配，橙色块前的减号要一直保留。": "The blue part is the negative of a square. The purple part allows distribution. Keep the minus sign before the orange part.", "每块先独立计算，最后一块的商为 −4，但整个加数是减去这个商。": "Calculate each part independently. The final quotient is −4, but the complete addend subtracts that quotient.", "减去 −4 变成加 4。把三个块合起来，得到 −1。": "Subtracting −4 means adding 4. Combining all three parts gives −1.", "在纸上用方框圈出三块，连块前的加减号一起标出。": "Box the three parts on paper, including the plus or minus sign before each.", "点击“分别算每块”，核对三个块分别得到什么。": "Select “Calculate each part” and check each of the three results.", "点击“按原来的符号合并”，特别解释第三块为什么贡献 +4。": "Select “Combine using the original signs”, especially explaining why the third part contributes +4.", "把原式与结果逐块对照：三块有没有全保留？第三块的“商为负”与“减去这个负商”不能混为一件事。": "Compare the original and result part by part. Are all three included? A negative quotient and subtracting that negative quotient are different operations.", "为什么最后一块 −[8 ÷ (−2)] 对总和的贡献是 +4？": "Why does the final part −[8 ÷ (−2)] contribute +4 to the total?", "因为减去负数 −4，等于加上 4": "Subtracting −4 is the same as adding 4", "因为两个负号一律去掉": "Because any two minus signs can be removed", "因为商本来就是 +4": "Because the quotient itself is +4", "括号内的商是 −4，括号外还有减号，所以这一块是 −(−4)=+4。先看完整结构，再谈符号。": "The quotient inside is −4, and a minus sign remains outside, so this part is −(−4)=+4. Read the complete structure before deciding its sign.", "计算 · 破局者": "Calculation Breakthrough", "计算破局者": "Calculation Breakthrough", "读一读 · 动一动 · 想明白": "Read · Explore · Understand", "已自动保存 · 当前浏览器": "Saved automatically in this browser", "✓ 进度保存在当前浏览器": "Progress saved in this browser", "学习记录保存在当前浏览器": "Learning records stay in this browser", "学习路线": "Learning path", "全屏": "Full screen", "说明": "Help", "学习目录 ☰": 步讲解。": "After studying the solution, answer the reflection below. You can view the explanation if you are unsure.", "分步看算式，逐行找依据": "Follow the expression and justify each line", "先观察：": "Observe first:", "看下一步 →": "Show next step →", "我想过了，看第一步 →": "Show the first step →", "展开完整解析": "Show the full solution", "收起，再想一次": "Collapse and try again", "易错提醒：": "Common mistake:", "五道题，检查自己是否会用。": "Five questions to check your understanding.", "先在纸上写过程，再填最终结果。数值可填整数、小数或分数，如 −3/4；选择题选一个答案。允许留空提交，未答也计入总题数。": "Write your working on paper, then enter the final answer as an integer, decimal, or fraction such as −3/4. Choose one option for multiple-choice questions. You may submit blanks; they count in the total.", "订正后重新提交会更新本轮成绩；成绩不限制继续学习。": "Resubmitting corrections updates this round's score. Scores do not block further learning.", "留一句自己的方法": "Write a reminder in your own words", "写一个识别信号或容易出错的地方。": "Note a useful clue or a mistake to watch for.", "← 回看应用例题": "← Review the application example", "这是最近一次提交的成绩。订正后再次提交，将更新本轮成绩。": "This is your latest submitted score. Resubmit corrections to update this round.", "有尚未重新提交的修改。": "Some changes have not been resubmitted.", "答案已保存为草稿；提交订正后才更新成绩。": "Answer saved as a draft. Submit corrections to update the score.", "✓ 正确 · 查看推理与计算": "✓ Correct · View reasoning and calculation", "○ 未作答 · 查看推理与计算": "○ Unanswered · View reasoning and calculation", "↺ 需要订正 · 查看推理与计算": "↺ Needs correction · View reasoning and calculation", "上次提交：": "Previous submission:", "；正确答案：": "; Correct answer:", "回到本关规律 →": "Review this lesson's method →", "回看方法总结 →": "Review the methods →", "提交订正，更新本轮 →": "Submit corrections →", "提交本轮答案 →": "Submit this round →", "查看本关总结": "View lesson summary", "同题新一轮自测": "Start a new round", "保留本轮记录，新一轮答案为空。": "This round is kept; the new round starts with blank answers.", "答案与结果": "Answers and results", "未提交": "Not submitted", "未答": "Unanswered", "正确": "Correct", "待订正": "Needs correction", "本轮已提交，解析就在每道题下方。": "Round submitted. Explanations are below each question.", "已新建一轮同题自测，上一轮记录已保留。": "New round created. The previous round has been kept.", "请先提交本轮检测，留空也可以提交。": "Submit this round first; blank answers are allowed.", "本关总结 · 回看方法与记录": "Lesson summary · Methods and records", "本关方法": "This lesson's method", "本关两招，带走再用": "Two shortcuts to use again", "回看妙招与随手练": "Review shortcut and practice", "再查一个典型错解": "Review a common error", "学习记录": "Learning record", "点击下面未读完的小节，继续把观察和例题想清楚。": "Select an unfinished step below to continue exploring the examples.", "四个学习小节已读完，本关总结已查看。": "All four steps are complete and this lesson's summary has been viewed.", "本轮五题检测尚未提交。可以先做题检查理解，也可以继续下一关；检测成绩不限制学习进度。": "This quiz round has not been submitted. Test your understanding or continue to the next lesson; scores do not block progress.", "接下来怎么学？": "What next?", "这一轮五题都答对了。再回想：你是否能解释每一次关键变形的依据？": "All five answers are correct. Can you explain the reason for each key rewriting?", "回看错题和未答题，找到自己在哪一步漏了符号、漏乘或选错方法。订正后重新提交，会更新本轮成绩。": "Review incorrect and blank answers. Find any missing signs or factors, or a method used incorrectly. Resubmit corrections to update this round.", "返回检测 / 订正": "Return to quiz / Correct answers", "← 七关路线": "← Seven-lesson path", "继续下一关 →": "Next lesson →", "查看知识总结 →": "View key ideas →", "七年级 / 有理数 / 混合运算技巧": "Grade 7 / Rational numbers / Mixed-operation techniques", "技巧与易错速查": "Shortcuts and common mistakes", "有基础以后 · 给复杂计算选一条短路": "Beyond the basics · Find an efficient route", "先看算式的信号，再选小妙招。": "Read the clues, then choose a shortcut.", "不用从头背规则。按你眼前的困难找到方法，先看一题怎样算，再做一道随手练，最后查一个容易踩的坑。": "Find a method for the difficulty you face. Study a worked example, try a practice problem, then check a common mistake.", "第一眼分块；第二眼找抵消、配对与共同因数；第三眼圈负号、括号和完整除数。算完再用符号、数量级和项数交叉检查。": "First split into parts; then look for cancellation, pairs and common factors; finally circle minus signs, brackets and complete divisors. Check the result's sign, size and term count.", "看到这种信号时用": "Use it when you see this clue", "看妙招与练习 →": "View shortcut and practice →", "找出第一处错误": "Find the first error", "基础规则速查：需要时再展开": "Basic rules: open when needed", "先括号，再乘方，再乘除，最后加减；同级通常从左到右。减法转加相反数，除法转乘非零除数的倒数。": "Brackets, then powers, then multiplication/division, then addition/subtraction. Work left to right within the same priority. Subtract by adding the opposite; divide by multiplying by the nonzero divisor's reciprocal.", "把“五条律”放在一起看": "The five operation laws", "这里 a、b、c 表示任意有理数。五条律包括两条加法运算律、两条乘法运算律和一条分配律；后面的技巧都能找到相应依据。": "Here a, b and c are rational numbers. Two laws concern addition, two multiplication, and one distribution. These laws justify the techniques in this course.", "运算律": "Law", "等式": "Equality", "它帮你做什么": "What it allows", "加法交换律": "Commutative law of addition", "加法结合律": "Associative law of addition", "乘法交换律": "Commutative law of multiplication", "乘法结合律": "Associative law of multiplication", "乘法分配律": "Distributive law", "换加数的位置": "Reorder addends", "换加法的分组": "Regroup addends", "换因数的位置": "Reorder factors", "换乘法的分组": "Regroup factors", "展开，或反过来提取公因数": "Expand, or factor in reverse", "使用范围要看清：减法、除法不能直接套交换律。例如 8 − 3 ≠ 3 − 8，8 ÷ 2 ≠ 2 ÷ 8。": "Check the conditions: subtraction and division are not commutative. For example, 8 − 3 ≠ 3 − 8 and 8 ÷ 2 ≠ 2 ÷ 8.", "综合出门条 →": "Mixed-problem exit ticket →", "综合出门条": "Mixed-problem exit ticket", "综合出门条 · 6 题": "Exit ticket · 6 questions", "最后一步 / 独立选择方法": "Final step / Choose your own method", "这次，不再告诉你用哪一招。": "This time, you choose the method.", "先写出过程和所用方法，再填结果。你可以返回任意关卡复习；出门条全部答对后，确认完成本次学习。": "Write your working and method, then enter the result. Revisit any lesson as needed. When every exit-ticket answer is correct, confirm completion.", "先把必学路线走完整": "Complete the learning path first", "出门条已全部答对": "All exit-ticket answers are correct", "回想一种你以前容易算错、现在会观察结构的方法，再点击下面的按钮完成。": "Recall one type of calculation you used to find difficult and how you now read its structure. Then confirm completion below.", "确认完成本次学习 ✓": "Confirm completion ✓", "学习记录已保存": "Learning record saved", "本次学习完成 ✓": "Learning completed ✓", "7 关必学路线已完成，6 道综合出门条全部正确。以后再遇到长算式，先观察，再动笔。": "All seven lessons are complete and all six exit-ticket answers are correct. Next time you see a long expression, observe before calculating.", "导出我的学习记录 ↗": "Export my learning record ↗", "回看方法地图": "Review the methods", "本次学习完成，记录已保存。": "Learning completed and record saved.", "错题回顾": "Review corrections", "从错误里找到下一步": "Learn your next step from mistakes", "把没有想清楚的地方，再走一遍。": "Revisit what you have not fully understood.", "显示每关当前轮次最近提交中的错题与空题。同轮订正正确后会自动移出；旧轮次仍可在各关历史记录和导出文件中查看。": "This shows incorrect and blank answers from the latest submission in each current round. Corrected answers disappear after resubmission. Earlier rounds remain in lesson history and exported records.", "上次答案：": "Previous answer:", "回到题目订正 →": "Return and correct →", "当前没有待订正的已提交题目。尚未提交的检测不会出现在这里；继续学习时，记得独立完成并提交。": "No submitted questions currently need correction. Unsubmitted quizzes do not appear here. Complete them independently and submit as you learn.", "怎样使用这份自学网页？": "How to use this self-study page", "从首页选择关卡，用“先观察、再比较、找原因、会应用”四步学习。": "Choose a lesson from the home page and follow four steps: Observe, Compare, Explain, Apply.", "按任务操作算式，再读原因解释；例题先在纸上想，再逐步展开。": "Explore expressions as instructed, then read the reasons. Try examples on paper before revealing the solution.", "点击“读完了，下一步”记录进度。五题检测可以留空提交、回看解析和订正。": "Select “Finished reading · Next step” to save progress. Quizzes allow blank submissions, solution reviews and corrections.", "四步读完并查看本关总结，记为本关学习完成。七关学完、出门条全对后可确认完成本次学习。": "A lesson is complete after all four steps and its summary. Complete seven lessons and answer every exit-ticket question correctly to confirm course completion.", "答案和草稿保存在当前浏览器，不自动跨设备同步。侧栏和首页底部都可以导出学习记录。": "Answers and drafts stay in this browser and do not sync automatically across devices. Export your record from the sidebar or home-page footer.", "知道了，继续学习": "Got it · Keep learning", "当前环境不支持全屏，可在浏览器中打开使用。": "Full screen is unavailable here. Try opening the page in a browser.", "学习记录已导出，请保管下载文件。": "Learning record exported. Keep the downloaded file.", "加减：先找一对": "Addition: find a pair", "点“看下一步”，盯住蓝色的 −8 和 +8。": "Select “Next step” and follow the blue −8 and +8.", "蓝色是一对；橙色先不动。": "Blue marks the pair; keep the orange term.", "先找到互为相反数的 −8 和 +8。": "First find the opposites −8 and +8.", "带着符号移动，让它们靠在一起。": "Move each number with its sign to bring the pair together.", "这一对相加是 0，只剩下 3。": "The pair adds to 0, leaving 3.", "把减法看成加上负数，就能交换加数的位置。−8 和 +8 抵消后，只剩中间的 3。用到的是加法交换律和结合律。": "Treat subtraction as adding a negative, then reorder the addends. −8 and +8 cancel, leaving 3. This uses the commutative and associative laws of addition.", "哪一行把符号也一起带走了？": "Which line moves the signs with the numbers?", "−8 还是 −8，+8 还是 +8，只换了位置。": "−8 stays −8 and +8 stays +8. Only their positions change.", "移动的是整个带符号的数，不能把 −8 变成 +8。": "Move the entire signed number. Do not turn −8 into +8.", "乘法：凑成 100": "Multiplication: make 100", "点“看下一步”，看看 4 怎样来到 25 身边。": "Select “Next step” and watch 4 move beside 25.", "蓝色先配对；橙色 7 保留下来。": "Pair the blue factors; keep the orange 7.", "25 和 4 是好搭档：它们的积是 100。": "25 and 4 make a useful pair: their product is 100.", "先把 4 移过来，7 仍然保留。": "Bring 4 across, keeping the factor 7.", "先算 25 × 4，再用 100 × 7。": "Calculate 25 × 4 first, then 100 × 7.", "这里全是乘法，可以交换因数，再把 25 与 4 结合。用到乘法交换律和结合律。如果夹着除法，先别直接照搬这个动作。": "All operations here are multiplication. Reorder the factors and group 25 with 4, using the commutative and associative laws. If division is mixed in, do not directly copy this move.", "哪一对先乘最方便？": "Which pair is easiest to multiply first?", "25 × 4 = 100。剩下的 ×7 不能漏掉。": "25 × 4 = 100. Keep the remaining factor ×7.", "配好一对，不等于整题算完了。还要乘剩下的 7。": "Finishing the pair does not finish the problem. You still need to multiply by 7.", "分配：每一项都乘": "Distribute: multiply every term", "点“看下一步”，数一数展开后出现几个 ×6。": "Select “Next step”. Count how many ×6 factors appear after expansion.", "蓝、紫两项，都要乘外面的 6。": "Both the blue and purple terms must be multiplied by 6.", "6 能被 2、3 整除，逐项乘会更容易。": "6 is divisible by 2 and 3, so multiplying each term is convenient.", "两项各乘一次 6，一个也不漏。": "Multiply each of the two terms by 6. Leave neither out.", "分数变成整数，现在只算 3 + 2。": "The fractions become integers. Now calculate 3 + 2.", "一个和乘 6，等于每一项分别乘 6 再相加，这就是分配律。这里 6÷2=3，6÷3=2，比先通分更直接。": "Multiplying a sum by 6 equals multiplying every term by 6 and adding: the distributive law. Here 6÷2=3 and 6÷3=2, avoiding a common denominator first.", "哪个展开式没有漏乘？": "Which expansion multiplies every term?", "括号里有两项，所以展开后要有两个 ×6。": "There are two terms in the brackets, so the expansion needs two ×6 factors.", "外面的数要乘每一项，不只是第一项。": "The outside factor multiplies every term, not just the first.", "小数：换个写法": "Decimals: change the form", "点“看下一步”，看看 0.25 换成什么，计算更轻松。": "Select “Next step” to see which form of 0.25 makes the calculation easier.", "蓝色换写法；数值始终不变。": "The blue number changes form, not value.", "先认出这个常见小数：0.25。": "Recognize the familiar decimal 0.25.", "0.25 就是 1/4，换写法没有改数值。": "0.25 equals 1/4. The value has not changed.", "12 的四分之一，就是 12 ÷ 4 = 3。": "One quarter of 12 is 12 ÷ 4 = 3.", "0.25 = 25/100 = 1/4。把小数换成分数后，乘 12 就是求 12 的四分之一。先记住这一对，用熟了再记 0.5=1/2、0.75=3/4。": "0.25 = 25/100 = 1/4. Multiplying by 12 means taking one quarter of 12. Practise this pair first, then add 0.5=1/2 and 0.75=3/4.", "0.25 可以准确地换成哪一个？": "Which value is exactly equal to 0.25?", "0.25 有两位小数，所以是 25/100，约分得 1/4。": "0.25 has two decimal places: 25/100 simplifies to 1/4.", "小数点后两位，先写成百分之几。": "Two decimal places mean hundredths.", "乘方：先看负号": "Powers: check the minus sign", "点“看下一步”，蓝色和紫色先各算各的。": "Select “Next step”. Calculate the blue and purple parts separately.", "蓝色算乘方；紫色算除法。": "Blue: evaluate the power. Purple: divide.", "先别加。把乘方和除法看成两块。": "Do not add yet. Treat the power and division as two parts.", "−2² 是 −4；12÷3 是 4。": "−2² is −4; 12÷3 is 4.", "两块都算好，再相加：−4 + 4 = 0。": "Now add the two re const biKey=s=>String(s).replace(/\s+/g,'').replace(/→$/,'');
const biMap=new Map(Object.entries(LANGUAGE_DICTIONARY).map(([zh,en])=>[biKey(zh),en]));
const biChinese=s=>/[\u3400-\u9fff]/.test(s);
function biLookup(text){
 const key=biKey(text),exact=biMap.get(key);if(exact)return exact;
 let m;
 if((m=key.match(/^([✓✔]?)((?:1\.先观察|2\.再比较|3\.找原因|4\.会应用))$/)))return(m[1]?'✓ ':'')+biMap.get(m[2]);
 if((m=key.match(/^已读(\d+)\/4步$/)))return`${m[1]}/4 steps read`;
 if((m=key.match(/^继续学习·已读(\d+)\/4步$/)))return`Continue · ${m[1]}/4 steps read`;
 if((m=key.match(/^七关学习进度：(\d+)\/7(.*)$/)))return`Lesson progress: ${m[1]}/7${m[2]?' · Learning completed ✓':''}`;
 if((m=key.match(/^←七关路线·已完成学习(\d+)\/7$/)))return`← Learning path · ${m[1]}/7 lessons completed`;
 if((m=key.match(/^第(\d+)关\/共7关·(.+)$/)))return`Lesson ${m[1]} of 7 · ${biLookup(m[2])||m[2]}`;
 if((m=key.match(/^小妙招(\d+)·看信号，少走弯路$/)))return`Shortcut ${m[1]} · Recognize the clue`;
 if((m=key.match(/^找错训练(\d+)·从第一处不相等开始查$/)))return`Error check ${m[1]} · Find the first false equality`;
 if((m=key.match(/^第(\d+)行$/)))return`Line ${m[1]}`;
 if((m=key.match(/^第一处错误：第(\d+)行。$/)))return`First error: line ${m[1]}.`;
 if((m=key.match(/^读一读·第(\d+)步(?:\/例题(\d+))?$/)))return`Read · Step ${m[1]}${m[2]?' / Example '+m[2]:''}`;
 if((m=key.match(/^算式(\d+)(·已试)?$/)))return`Expression ${m[1]}${m[2]?' · Tried':''}`;
 if((m=key.match(/^例题(\d+)$/)))return`Example ${m[1]}`;
 if((m=key.match(/^第(\d+)步·(.+)$/))){const en=biLookup(m[2]);if(en)return`Step ${m[1]} · ${en}`;}
 if((m=key.match(/^(\d+)\/(\d+)步$/)))return`${m[1]} / ${m[2]} steps`;
 if((m=key.match(/^自己算一算·第(\d+)轮$/)))return`Your turn · Round ${m[1]}`;
 if((m=key.match(/^第(\d+)题选项$/)))return`Question ${m[1]} options`;
 if((m=key.match(/^正确(\d+)·答错(\d+)·未答(\d+)。正确率按本轮全部(\d+)题计算。$/)))return`Correct ${m[1]} · Incorrect ${m[2]} · Unanswered ${m[3]}. Accuracy uses all ${m[4]} questions in this round.`;
 if((m=key.match(/^(.+)，你带走了什么？$/))){const en=biLookup(m[1]);if(en)return`${en}: what have you learned?`;}
 if((m=key.match(/^已读完(\d+)\/4个小节。(.+)$/))){const en=biLookup(m[2]);if(en)return`${m[1]} / 4 steps completed. ${en}`;}
 if((m=key.match(/^还有(\d+)关未完成“读完讲解\+查看本关总结”。关卡检测不要求全对，下面这些入口可以继续学习。$/)))return`${m[1]} lessons still need all reading steps and their summary completed. Quizzes do not require full marks. Continue with the links below.`;
 if((m=key.match(/^本关共(\d+)轮·查看历史提交$/)))return`${m[1]} rounds · View past submissions`;
 if((m=key.match(/^第(\d+)轮：(.+)$/)))return`Round ${m[1]}: ${biLookup(m[2])||m[2]}`;
 if((m=key.match(/^(\d+)·(.+)$/))){const en=biLookup(m[2]);if(en)return`${m[1]} · ${en}`;}
 if((m=key.match(/^(.+)·第(\d+)题$/))){const en=biLookup(m[1]);if(en)return`${en} · Question ${m[2]}`;}
 if((m=key.match(/^6题$/)))return'6 questions';
 if((m=text.trim().match(/^原式：(.*)$/s)))return`Original expression: ${m[1]}`;
 if((m=text.trim().match(/^(.*?)：(.+)（(正确|待订正)）$/s)))return`${biLookup(m[1])||m[1]}: ${m[2]} (${m[3]==='正确'?'Correct':'Needs correction'})`;
 return null;
}
function biPlain(node){
 if(node.nodeType===3)return node.textContent;
 if(node.nodeType!==1)return'';
 if(node.classList.contains('fraction'))return node.querySelector('.num').textContent+'/'+node.querySelector('.den').textContent;
 if(node.classList.contains('bi-en'))return'';
 return Array.from(node.childNodes,biPlain).join('');
}
function biPairNode(original,en){
 const pair=document.createElement('span');pair.className='bi-pair';
 const zh=document.createElement('span');zh.className='bi-zh';zh.lang='zh-CN';
 const english=document.createElement('span');english.className='bi-en';english.lang='en';
 english.textContent=en;zh.append(...original);pair.append(zh,english);return pair;
}
function biTranslate(el){
 if(el.nodeType!==1||el.matches('script,style,input,textarea,select,option,.fraction,.bi-pair,.language-switch,[data-user-content]'))return;
 const hasControls=el.querySelector('input,textarea,button,a,select,[data-user-content]');
 const inlineTag=/^(P|LI|H[1-6]|SPAN|SMALL|STRONG|B|EM|LABEL|TD|TH|SUMMARY|BUTTON|A)$/.test(el.tagName);
 const noBlocks=!el.querySelector('p,li,h1,h2,h3,h4,div,section,article,ul,ol,table');
 if(!hasControls&&noBlocks&&!el.querySelector('.bi-pair')&&(inlineTag||el.childNodes.length<8)){
  const plain=biPlain(el),en=biChinese(plain)?biLookup(plain):null;
  if(en){el.append(biPairNode(Array.from(el.childNodes),en));return;}
 }
 // A paragraph may contain a bold label, then a complete sentence with fraction spans.
 // Translate that sentence as a run, retaining the original inline mathematics.
 let run=[];
 const flush=()=>{
  if(!run.length)return;
  const text=run.map(biPlain).join(''),en=biChinese(text)?biLookup(text):null;
  if(en){const marker=document.createTextNode('');run[0].before(marker);marker.replaceWith(biPairNode(run,en));}
  run=[];
 };
 for(const node of Array.from(el.childNodes)){
  if(node.nodeType===3||(node.nodeType===1&&node.matches('.fraction,.math')&&!node.querySelector('.bi-pair'))){run.push(node);}
  else flush();
 }
 flush();
 for(const node of Array.from(el.childNodes)){
  if(node.nodeType===1){biTranslate(node);continue;}
  if(node.nodeType!==3||!biChinese(node.textContent))continue;
  const en=biLookup(node.textContent);
  if(en)node.replaceWith(biPairNode([node.cloneNode()],en));
 }
}
// Student-authored notes/answers are excluded; dynamic feedback translates only its UI.
function biMarkUserContent(){
 for(const el of document.querySelectorAll('.coach-feedback p,.feedback p,.wrongitem p')){
  if(el.querySelector('[data-user-content]'))continue;
  const first=el.firstChild;if(!first||first.nodeType!==3)continue;
  const match=first.textContent.match(/^(最近提交：|上次提交：|上次答案：)(.*?)(；正确(?:结果|答案)：)$/s);
  if(match){
   const fragment=document.createDocumentFragment();
   fragment.append(document.createTextNode(match[1]));
   const user=document.createElement('span');user.dataset.userContent='true';user.textContent=match[2];fragment.append(user,document.createTextNode(match[3]));
   first.replaceWith(fragment);
  }
 }
}
let biObserver;
function biHeaderSize(){document.documentElement.style.setProperty('--bi-header-height',document.querySelector('.topbar').getBoundingClientRect().height+'px');}
function applyBilingual(){
 biObserver?.disconnect();biMarkUserContent();biTranslate(document.body);
 const active=S.language==='bilingual';
 document.body.classList.toggle('bilingual',active);
 document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===S.language)));
 document.querySelectorAll('input.answer').forEach(el=>{el.placeholder=active?'整数 / 小数 / 分数 · Number / fraction':'整数 / 小数 / 分数';});
 biHeaderSize();
 biObserver?.observe(document.body,{subtree:true,childList:true,characterData:true});
}
S.language=S.language==='bilingual'?'bilingual':'zh';
const languageSwitch=document.createElement('div');languageSwitch.className='language-switch';languageSwitch.setAttribute('role','group');languageSwitch.setAttribute('aria-label','语言 / Language');
languageSwitch.innerHTML='<button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button><button type="button" data-language="bilingual" aria-label="中英双语 Chinese and English" aria-pressed="false">中英 <span lang="en">CN / EN</span></button>';
document.querySelector('.toptools').prepend(languageSwitch);
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-language]');if(!button)return;
 S.language=button.dataset.language;save();applyBilingual();
});
const renderBeforeBilingual=render;
render=function(scroll=true){renderBeforeBilingual(scroll);applyBilingual();};
biObserver=new MutationObserver(applyBilingual);
window.addEventListener('resize',biHeaderSize);
window.bilingualCoverage=function(){
 const missing=new Set();
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 for(let node;node=walker.nextNode();){
  const parent=node.parentElement;
  if(!biChinese(node.textContent)||parent.closest('script,style,textarea,input,.bi-pair,.language-switch,[data-user-content]'))continue;
  missing.add(node.textContent.trim());
 }
 return [...missing].filter(Boolean);
};

render(false);
</script></body></html>
